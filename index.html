<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="素振り">
<meta name="theme-color" content="#0A0D13">
<title>Bokuto</title>
<style>
:root{
  --bg:#0A0D13; --bg2:#0F131C; --panel:#141924; --panel2:#1B2130;
  --line:rgba(255,255,255,.09); --text:#EAF0FA; --text-dim:#8590A8;
  --suburi:#00E5C4; --suburi-dim:rgba(0,229,196,.16);
  --nawa:#3AB4FF;   --nawa-dim:rgba(58,180,255,.16);
  --accent:#3DFFB0; --accent-dim:rgba(61,255,176,.17);
  --shoku:#FFB547;  --shoku-dim:rgba(255,181,71,.16);
  --warn:#FF3D6E;   --warn-dim:rgba(255,61,110,.13);
  --gold:#FFD166;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--gothic)}
body{
  font-size:15px;line-height:1.7;max-width:30rem;margin:0 auto;min-height:100vh;
  /* iPhoneのカメラ部分（ノッチ）とホームバーを避ける */
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(92px + env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse 600px 300px at 15% -5%, var(--suburi-dim), transparent 60%),
    radial-gradient(ellipse 600px 300px at 100% 8%, var(--nawa-dim), transparent 60%),
    var(--bg);
}
body.overlay{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font-family:inherit}

/* ── ヘッダー ── */
.app-header{display:flex;align-items:center;gap:8px;padding:8px 0 0;min-height:36px}
.app-title{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--text)}
.app-version{font-family:var(--mono);font-size:11px;color:var(--accent);padding:2px 8px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-dim)}
.hizuke{margin:4px 0 0;font-size:12px;color:var(--text-dim);letter-spacing:.18em}

/* ── 共通パーツ ── */
.card{margin-top:14px;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.midashi{font-size:11.5px;margin:0 0 10px;font-weight:800;letter-spacing:.18em;color:var(--text-dim)}
.btn{display:block;width:100%;padding:15px;border-radius:10px;font-size:15px;font-weight:800;letter-spacing:.06em;text-align:center}
.btn-main{background:linear-gradient(90deg,var(--suburi),var(--nawa));color:#071015}
.btn-shoku{background:var(--shoku);color:#241500}
.btn-accent{background:var(--accent);color:#06140D}
.btn-sub{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn-warn{background:var(--warn);color:#fff}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.hint{font-size:11.5px;color:var(--text-dim);margin:8px 0 0;line-height:1.6}
.chip-retsu{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:20px;background:var(--panel2);font-size:13px;color:var(--text-dim)}
.chip.eranda{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.warn.eranda{background:var(--warn-dim);border-color:var(--warn);color:var(--warn)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.nyuryoku{display:flex;gap:8px;align-items:center}
.nyuryoku input,.field{
  font-family:var(--mono);font-size:18px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg2);color:var(--text);
}
.nyuryoku input{width:6em;text-align:right}
.nyuryoku .tani{color:var(--text-dim);font-size:13px}
.nyuryoku .btn-mini{margin-left:auto}
.btn-mini{padding:10px 16px;border-radius:8px;background:var(--accent);color:#06140D;font-weight:800;font-size:13px;white-space:nowrap}
.btn-mini.sub{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
textarea.field{width:100%;font-family:var(--gothic);font-size:14px;min-height:64px;resize:vertical}
select.field{font-family:var(--gothic);font-size:14px}

/* ── 再開バナー ── */
.saikai{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-dim);border:1px solid var(--accent);display:flex;align-items:center;gap:10px}
.saikai p{margin:0;font-size:14px;flex:1}

/* ── 今日のメニュー ── */
.menu-gyo{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.menu-gyo:last-of-type{border-bottom:0}
.menu-gyo .atai{font-family:var(--mono);font-size:19px;font-weight:800}
.c-suburi{color:var(--suburi)}.c-nawa{color:var(--nawa)}.c-shoku{color:var(--shoku)}.c-dim{color:var(--text-dim)}
.chosei{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg2);border-radius:4px;font-size:12.5px;line-height:1.6;color:var(--text-dim)}
.chosei.itami{border-left-color:var(--warn);background:var(--warn-dim);color:#FFD5DF}
.taicho{padding:16px;border-radius:12px;background:var(--warn-dim);border:1px solid var(--warn)}
.taicho p{margin:0 0 12px;font-size:14px;color:#FFE3EA}
.taicho .btns{display:flex;flex-direction:column;gap:8px}

/* ── カロリーカード ── */
.kcal-ue{display:flex;align-items:baseline;gap:6px}
.kcal-ue .ookii{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--shoku);line-height:1}
.kcal-ue .chiisai{font-size:13px;color:var(--text-dim)}
.bar{margin-top:10px;height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--shoku))}
.bar.over i{background:var(--warn)}
.kcal-shita{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-dim)}

/* ── 体重 ── */
.taiju-retsu{display:flex;align-items:baseline;gap:6px}
.taiju-kazu{font-family:var(--mono);font-size:44px;font-weight:800;line-height:1}
.taiju-kazu small{font-size:16px;color:var(--text-dim);margin-left:2px;font-weight:400}
.taiju-mikei{font-size:15px;color:var(--text-dim)}
.kumi-retsu{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.kumi dt{font-size:10.5px;color:var(--text-dim);margin:0;letter-spacing:.06em}
.kumi dd{margin:0;font-family:var(--mono);font-size:16px}
.bunkatsu{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* ── その他の運動 ── */
.sonota-gyo{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.batsu{width:32px;height:32px;border-radius:8px;color:var(--text-dim);font-size:18px;line-height:1}
.sonota-add{display:flex;gap:8px;margin-top:10px;align-items:center}
.sonota-add select{flex:1}
.sonota-add input{width:4.6em;text-align:right}

/* ── 今週 ── */
.masu{display:flex;gap:6px}
.hi{flex:1;text-align:center}
.hi .yobi{font-size:11px;color:var(--text-dim)}
.hi .shirushi{margin-top:4px;height:36px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--text-dim);background:var(--bg2)}
.hi.jisshi .shirushi{background:var(--suburi-dim);border-color:var(--suburi);color:var(--suburi);font-weight:800}
.hi.kyo .shirushi{box-shadow:0 0 12px var(--accent-dim);border-color:var(--accent)}
.hi.kyo .yobi{color:var(--accent);font-weight:800}
.hi[data-hizuke]{cursor:pointer}

/* ── 下部タブバー ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,13,19,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar.kakusu{display:none}
.tabbar-uchi{display:flex;max-width:30rem;margin:0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:10.5px;color:var(--text-dim);font-weight:700;letter-spacing:.04em}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.eranda{color:var(--accent)}

/* ── 画面ヘッダー（戻る付き）── */
.gamen-head{display:flex;align-items:center;gap:6px;padding:8px 0 4px;min-height:44px}
.modoru{padding:10px 12px 10px 0;font-size:14px;color:var(--text-dim)}
.gamen-title{font-size:13px;font-weight:800;letter-spacing:.12em}

/* ── 運動画面 ── */
.phase-tabs{display:flex;gap:8px;margin:6px 0 18px}
.phase-tab{flex:1;padding:13px 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;color:var(--text-dim);font-weight:800}
.phase-tab.on-suburi{background:var(--suburi-dim);border-color:var(--suburi);color:var(--suburi)}
.phase-tab.on-nawa{background:var(--nawa-dim);border-color:var(--nawa);color:var(--nawa)}
.undou{text-align:center}
.ring-wrap{position:relative;width:228px;height:228px;margin:6px auto 4px}
.ring{position:absolute;inset:0;border-radius:50%}
.ring-uchi{position:absolute;inset:14px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line)}
.taimaa{font-family:var(--mono);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mokuhyo{font-size:12px;color:var(--text-dim);margin:6px 0 0}
.interval{margin:10px auto 0;display:inline-block;padding:8px 22px;border-radius:24px;font-weight:800;font-size:18px;letter-spacing:.2em}
.interval.tobu{background:var(--nawa);color:#04121D}
.interval.yasumu{background:var(--panel2);color:var(--text-dim);border:1px solid var(--line)}
.kazu{margin-top:18px;font-family:var(--mono);font-size:26px;font-weight:800}
.kazu-btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
.kazu-btns button{padding:11px 0;width:76px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-family:var(--mono);font-size:14px}
.kazu-btns.minus button{color:var(--text-dim);padding:8px 0;font-size:12.5px}
.sosa{display:flex;gap:10px;margin-top:26px}
.sosa .btn{flex:1}
.tassei{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:20px;background:var(--gold);color:#3A2A00;font-size:12px;font-weight:800;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.particle-layer{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:0;animation:fly 900ms ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(120px) scale(.3)}}

/* ── 記録・修正の行 ── */
.gyo{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;font-size:14px}
.gyo label{color:var(--text-dim);font-size:13px;flex-shrink:0}
.gyo input{width:5.6em;text-align:right;font-size:16px}
.gyo .atai{font-family:var(--mono);font-size:17px}
.hirou{display:flex;gap:6px}
.hirou button{flex:1;padding:10px 2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:11px;line-height:1.5;color:var(--text-dim)}
.hirou button.eranda{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:800}
.badge{display:inline-block;margin:0 6px 6px 0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid var(--gold);color:var(--gold);background:rgba(255,209,102,.1)}

/* ── 食事 ── */
.hi-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.hi-nav button{width:44px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:16px}
.hi-nav .hyoji{font-size:15px;font-weight:800}
.meal{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px}
.meal-hon{flex:1;min-width:0}
.meal-ue{display:flex;justify-content:space-between;gap:8px}
.meal-namae{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.meal-kcal{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--shoku);white-space:nowrap}
.meal-sub{font-size:11.5px;color:var(--text-dim)}
.meal-adv{font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.55}
.meal-sosa{display:flex;gap:8px;margin-top:6px}
.meal-sosa button{font-size:12px;color:var(--text-dim);padding:4px 10px;border:1px solid var(--line);border-radius:6px}
.memo-waku{position:relative}
.step,.step-w{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;margin-right:8px;vertical-align:1px}
.step{background:var(--shoku);color:#241500;letter-spacing:0}
.step-w{background:rgba(0,0,0,.25);color:inherit}
.kcal-nyu{display:flex;align-items:baseline;gap:8px}
.kcal-nyu input{width:7em;font-size:26px;font-weight:800;text-align:right}
.kcal-nyu .tani{color:var(--text-dim)}
.keisan{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--text-dim)}
.keisan input{width:4.6em;font-size:15px;text-align:right;padding:7px 8px}
.meal-kcal.minyu{color:var(--text-dim);font-size:12.5px;font-weight:700}
.tb-gyo{flex:1;display:flex;justify-content:space-between;gap:10px;text-align:left;font-size:14px;padding:4px 0}
.tb-gyo .num{font-size:13px;color:var(--text-dim);white-space:nowrap}
.radio{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.radio input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.radio input[type=date]{font-size:14px;padding:6px 8px}
.radio input[type=date]:disabled{opacity:.4}
details.shosai summary{font-size:12.5px;color:var(--text-dim);cursor:pointer;padding:6px 0}
.mk-ue{display:flex;align-items:baseline;gap:4px;font-size:14px;color:var(--text-dim)}
.mk-hi{font-size:20px;font-weight:800;color:var(--text)}
.mk-kg{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--accent);margin-left:4px}
.mk-midashi{margin:14px 0 6px;font-size:12px;font-weight:800;color:var(--text-dim);letter-spacing:.06em}
.mk-wake{display:flex;gap:8px}
.mk-wake div{flex:1;padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:12px}
.mk-wake b{display:block;font-size:22px;margin-top:2px}
.mk-wake small{color:var(--text-dim);margin-left:2px}
.mk-rei div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mk-rei div:last-child{border-bottom:0}
.mk-rei b{font-size:16px}
.saikai.shoku{background:var(--shoku-dim);border-color:var(--shoku)}
.saikai.shoku .btn-mini{background:var(--shoku);color:#241500}
.link-btn{font-size:12.5px;color:var(--shoku);text-decoration:underline;padding:4px 0}
.kettei-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(10,13,19,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.kettei-bar p{margin:0 auto 6px;max-width:30rem;font-size:12px;color:var(--text-dim);text-align:center}
.kettei-bar .btn{max-width:30rem;margin:0 auto}
body.overlay.kettei{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.memo-waku textarea{min-height:84px;padding-right:58px;font-size:15px}
.mic{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--shoku);color:#241500;display:flex;align-items:center;justify-content:center;font-size:16px}
.mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.mic.kiku{background:var(--warn);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.photo-waku.chiisai{min-height:72px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.teiban-retsu{display:flex;flex-direction:column;gap:8px}
.teiban-btn{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;background:var(--shoku-dim);border:1px solid rgba(255,181,71,.4);font-size:14px;font-weight:700;text-align:left}
.teiban-btn .num{color:var(--shoku)}
.teiban-chip .num{margin-left:6px;font-size:11px;opacity:.8}
.photo-waku{margin-top:4px;border:1.5px dashed var(--line);border-radius:14px;min-height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:var(--bg2)}
.photo-waku img{width:100%;display:block}
.photo-waku .nashi{color:var(--text-dim);font-size:13px;text-align:center;padding:20px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.kekka-ryori{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kekka-ryori .ryo{display:block;font-size:11.5px;color:var(--text-dim)}
.kekka-goukei{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px}
.kekka-goukei .num{font-size:28px;font-weight:800;color:var(--shoku)}
.adv-box{margin-top:12px;padding:12px;border-radius:10px;background:var(--shoku-dim);border:1px solid rgba(255,181,71,.35);font-size:13.5px;line-height:1.7}
.err{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--warn-dim);color:#FFD5DF;font-size:13px}
.loading{margin-top:12px;text-align:center;color:var(--text-dim);font-size:13px}
.loading::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid var(--shoku);border-top-color:transparent;border-radius:50%;animation:kaiten 0.8s linear infinite}
@keyframes kaiten{to{transform:rotate(360deg)}}

/* ── 推移 ── */
.renzoku{position:relative;overflow:hidden;text-align:center;padding:22px 16px}
.renzoku::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,var(--suburi),var(--nawa),var(--suburi));opacity:.1;animation:kaiten 8s linear infinite}
.renzoku .kazu-ookii{position:relative;font-family:var(--mono);font-size:52px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--suburi),var(--nawa));-webkit-background-clip:text;background-clip:text;color:transparent}
.renzoku p{position:relative;margin:6px 0 0;font-size:13px;color:var(--text-dim)}
.heatmap-wrap{overflow-x:auto;padding-bottom:4px}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content}
.hc{width:14px;height:14px;border-radius:3px;background:var(--panel2)}
.hc.l1{background:var(--suburi);opacity:.28}.hc.l2{background:var(--suburi);opacity:.5}

<body>
<div id="app"></div>
<nav id="tabbar" class="tabbar"></nav>

<script>
"use strict";
/* ===========================================================
   Bokuto — 木刀素振り＋縄跳び＋体重・食事の個人用管理アプリ
   バージョン履歴（増分：新機能 +0.1／不具合修正のみ +0.0.1）
   v1.0  実装1：データ層＋ホーム＋体重入力
   v1.1  実装2：運動画面の追加
   v1.2  2026-09-13 フェーズ手直しタブ／回数の－ボタン／分数補正／痛みの左右
   v1.3  2026-09-13 配色テーマ（爽やか／派手）切替
   v1.4  2026-09-13 一段昇降にも回数カウント
   v1.5  2026-09-13 推移画面（継続日数・ヒートマップ・折れ線）
   v1.6  2026-09-14 過去の記録の修正、痛みの翌日の体調確認と配分提案
   v1.7  2026-10-28 一段昇降→縄跳び（インターバル表示つき）に切替、
                    その他の運動（ウォーキング等）の記録、食事の写真記録と
                    AI（GAS経由のGemini）によるカロリー推定・アドバイス、
                    身長・目標体重から1日の摂取目安を計算、下部タブで
                    画面を切替、iPhoneのカメラ部分に隠れないレイアウト
   v1.8  2026-11-04 食事を写真なしで「話す・書く」だけでAI推定できるように
                    （音声入力ボタン）、毎日同じ食事を「定番」に登録して
                    ホームから1タップで記録、設定で定番を削除
   v1.8.1 2026-11-04 食事の入力で先に進めない問題を修正：画面下に常に押せる
                    決定ボタン（次にすることを表示）、1個×個数の計算、
                    料理名が空なら話した文をそのまま使う、記録後に確認表示
   v1.9  2026-11-04 定番のkcal・名前を後から直せる画面。反映先を「これまで全部」
                    「○月○日から」「これからだけ」から選べ、過去の記録も直る。
                    kcalを入れずに記録して、あとから入れられる（未入力件数を表示）
   v1.10 2026-11-04 GASなしでAIを使えるように：設定にGeminiのAPIキーを貼るだけで、
                    iPhoneから直接カロリー推定（キーは端末内だけに保存）。GASは任意に
   v1.10.1 2026-11-04 AIが混み合っているとき（503）に、自動で別のモデルへ切り替えて
                    やり直すように修正
   v1.10.2 2026-11-04 iPhoneで「通信できませんでした」になる問題への対策：ブラウザに
                    止められたら、事前チェック不要の簡単な形式で送り直す。失敗時は
                    原因の手がかり（エラー名）を表示
   v1.11 2026-11-05 「○月○日に○kg」の目標を設定し、1日に減らすkcalを食事と運動に
                    分けて逆算。素振り・縄跳び・ウォーキングの分数、ここ7日の運動との
                    差、今の減り方での到達見込み、速すぎるペースの警告をホームに表示。
                    AIの通信回数を1回あたり最大5回に減らした
   v1.11.1 2026-11-11 食事のAI推定が遅くて切れる問題を修正：軽いモデルを先に使い、
                    考える時間（thinking）を最小に。1回25秒で時間切れにして次のモデルへ。
                    写真を小さくして送る。待ち時間を秒で表示。書きかけの食事を保存し、
                    アプリが閉じてもホームの「続ける」から再開できる
   =========================================================== */
const APP_VERSION = "1.11.1";

/* ---------- 保存層 ---------- */
const Kioku = (() => {
  let tsukaeru = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch { tsukaeru = false; }
  const memori = {};
  return {
    tsukaeru,
    yomu(key, kitei){
      try{
        const s = tsukaeru ? localStorage.getItem(key) : memori[key];
        return s ? JSON.parse(s) : kitei;
      }catch{ return kitei; }
    },
    kaku(key, atai){
      const s = JSON.stringify(atai);
      if (tsukaeru){ try{ localStorage.setItem(key, s); return true; }catch{ return false; } }
      memori[key] = s; return true;
    }
  };
})();

/* 記録・設定のキーは以前のバージョンと同じ（過去データをそのまま引き継ぐ） */
const KEY_KIROKU  = "bokuto.kiroku.v1";
const KEY_SETTEI  = "bokuto.settei.v1";
const KEY_SESSION = "bokuto.session.v3";
const KEY_TAICHO  = "bokuto.taicho.v1";

/* ---------- 設定 ---------- */
const KITEI_SHUKAN = [            // 日〜土の目安（分）
  { suburi:13, nawatobi:5 },
  { suburi:25, nawatobi:5 },
  { suburi:20, nawatobi:5 },
  { suburi:15, nawatobi:0 },
  { suburi:25, nawatobi:5 },
  { suburi:20, nawatobi:5 },
  { suburi:30, nawatobi:8 },
];
const KITEI_SETTEI = {
  kaishiBi: null,
  kaishiTaiju: 74.0,
  mokuhyoTaiju: 66.0,
  mokuhyoBi: "",
  shinchoCm: 173.5,
  nenrei: 54,
  seibetsu: "dansei",
  katsudo: "karui",
  colorTeema: "sawayaka",
  nawaInterval: true,
  geminiKey: "",
  geminiModel: "",
  gasUrl: "",
  gasToken: "",
  teiban: [],
  shukan: KITEI_SHUKAN
};
const KATSUDO = {
  hotondo:{ t:"ほぼ座っている", k:1.2 },
  karui:  { t:"立ち仕事・軽く動く", k:1.375 },
  futsu:  { t:"よく動く", k:1.55 }
};

function setteiYomu(){
  const s = Object.assign({}, KITEI_SETTEI, Kioku.yomu(KEY_SETTEI, {}));
  if (!Array.isArray(s.shukan) || !s.shukan[0] || !("nawatobi" in s.shukan[0])) s.shukan = KITEI_SHUKAN;
  if (!s.kaishiBi){ s.kaishiBi = kyoNoHizuke(); Kioku.kaku(KEY_SETTEI, s); }
  return s;
}
function setteiKaku(s){ Kioku.kaku(KEY_SETTEI, s); }

/* ---------- 配色テーマ ---------- */
const TEEMA = {
  sawayaka:{ suburi:"#00E5C4", nawa:"#3AB4FF", accent:"#3DFFB0", shoku:"#FFB547" },
  hade:    { suburi:"#D4FF1F", nawa:"#FF2E9C", accent:"#FFDA00", shoku:"#FF8A3D" }
};
function hexDim(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function teemaTekiyou(name){
  const t = TEEMA[name] || TEEMA.sawayaka;
  const r = document.documentElement.style;
  r.setProperty("--suburi", t.suburi); r.setProperty("--suburi-dim", hexDim(t.suburi,.16));
  r.setProperty("--nawa", t.nawa);     r.setProperty("--nawa-dim", hexDim(t.nawa,.16));
  r.setProperty("--accent", t.accent); r.setProperty("--accent-dim", hexDim(t.accent,.17));
  r.setProperty("--shoku", t.shoku);   r.setProperty("--shoku-dim", hexDim(t.shoku,.16));
}

/* ---------- 日付 ---------- */
function hizukeMoji(d){
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function kyoNoHizuke(){ return hizukeMoji(new Date()); }
function hizukeZurasu(moji, nichi){
  const [y,m,d] = moji.split("-").map(Number);
  return hizukeMoji(new Date(y, m-1, d + nichi));
}
function yobiBango(moji){
  const [y,m,d] = moji.split("-").map(Number);
  return new Date(y, m-1, d).getDay();
}
const YOBI = ["日","月","火","水","木","金","土"];
function hizukeHyoji(moji){
  const [,m,d] = moji.split("-");
  return `${Number(m)}月${Number(d)}日（${YOBI[yobiBango(moji)]}）`;
}
function jikanMoji(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function funByou(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
}

/* ---------- 記録 ----------
   DailyRecord = { date, weightKg, waistCm,
     suburiMin, suburiCount, nawatobiMin, nawatobiCount,
     shokoMigiMin, shokoHidariMin, shokoCount,   ← 旧記録（一段昇降）は残す
     sonota:[{id,shurui,fun}], meals:[{id,jikan,kubun,namae,kcal,naiyo,advice,thumb}],
     fatigue, pain[], legModeUsed } */
function kirokuZenbu(){ return Kioku.yomu(KEY_KIROKU, {}); }
function kirokuHozon(zenbu){
  if (Kioku.kaku(KEY_KIROKU, zenbu)) return true;
  // 容量オーバー時は写真の縮小版を外して記録の数字を守る
  Object.values(zenbu).forEach(r => (r.meals||[]).forEach(m => { delete m.thumb; }));
  return Kioku.kaku(KEY_KIROKU, zenbu);
}
function kirokuToru(h){ return kirokuZenbu()[h] || null; }
function kirokuKaku(h, henko){
  const zenbu = kirokuZenbu();
  const moto = zenbu[h] || {
    date:h, weightKg:null, waistCm:null, suburiMin:0, suburiCount:null,
    nawatobiMin:0, nawatobiCount:null, shokoMigiMin:0, shokoHidariMin:0, shokoCount:null,
    sonota:[], meals:[], fatigue:null, pain:[], legModeUsed:null
  };
  zenbu[h] = Object.assign(moto, henko);
  kirokuHozon(zenbu);
  return zenbu[h];
}
function shinId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* 写真の縮小版は直近14日分だけ残す（スマホの保存容量を守るため） */
function thumbSeiri(){
  const genkai = hizukeZurasu(kyoNoHizuke(), -14);
  const zenbu = kirokuZenbu();
  let kawatta = false;
  Object.keys(zenbu).forEach(h => {
    if (h >= genkai) return;
    (zenbu[h].meals||[]).forEach(m => { if (m.thumb){ delete m.thumb; kawatta = true; } });
  });
  if (kawatta) kirokuHozon(zenbu);
}

/* ---------- 集計 ---------- */
function idoHeikin(h, nissu, field){
  const zenbu = kirokuZenbu();
  let g = 0, k = 0;
  for (let i = 0; i < nissu; i++){
    const r = zenbu[hizukeZurasu(h, -i)];
    if (r && typeof r[field] === "number"){ g += r[field]; k++; }
  }
  return k ? { heikin:g/k, kensu:k } : { heikin:null, kensu:0 };
}
function saishinTaiju(h){
  const zenbu = kirokuZenbu();
  for (let i = 0; i < 60; i++){
    const r = zenbu[hizukeZurasu(h, -i)];
    if (r && typeof r.weightKg === "number") return r.weightKg;
  }
  return null;
}
function genzaiTaiju(h){ return saishinTaiju(h) || setteiYomu().kaishiTaiju || 70; }
function shokoFun(r){ return (r.shokoMigiMin||0) + (r.shokoHidariMin||0); }
function sonotaFun(r){ return (r.sonota||[]).reduce((a,s) => a + (Number(s.fun)||0), 0); }
function goukeiFun(r){
  if (!r) return 0;
  return (r.suburiMin||0) + (r.nawatobiMin||0) + shokoFun(r) + sonotaFun(r);
}

/* ---------- カロリー ----------
   運動はMETs法の目安。食事の目安はミフリン・セントジョア式の基礎代謝×活動量から、
   目標体重より重いあいだは1日400kcal控えめにする（基礎代謝は下回らない）。 */
const METS = { suburi:4.5, nawatobi:7.0, shoko:4.0 };
const SONOTA_SHURUI = [
  { v:"walk",     t:"ウォーキング", mets:3.5 },
  { v:"jitensha", t:"自転車",       mets:4.0 },
  { v:"stretch",  t:"ストレッチ",   mets:2.5 },
  { v:"kintore",  t:"筋トレ",       mets:3.5 },
  { v:"sonota",   t:"その他",       mets:3.0 }
];
function sonotaInfo(v){ return SONOTA_SHURUI.find(x => x.v === v) || SONOTA_SHURUI[4]; }
function kcalUndou(r, w){
  if (!r) return 0;
  const h = m => (Number(m)||0) / 60;
  let k = METS.suburi*w*h(r.suburiMin) + METS.nawatobi*w*h(r.nawatobiMin) + METS.shoko*w*h(shokoFun(r));
  (r.sonota||[]).forEach(s => { k += sonotaInfo(s.shurui).mets * w * h(s.fun); });
  return Math.round(k * 1.05);
}
function kcalSesshu(r){ return ((r && r.meals) || []).reduce((a,m) => a + (Number(m.kcal)||0), 0); }
function kisoTaisha(s, w){
  return 10*w + 6.25*s.shinchoCm - 5*s.nenrei + (s.seibetsu === "josei" ? -161 : 5);
}
function shohiKcal(s, w){ return kisoTaisha(s, w) * (KATSUDO[s.katsudo] || KATSUDO.karui).k; }
function mokuhyoKcal(s, w){
  const bmr = kisoTaisha(s, w);
  const tdee = shohiKcal(s, w);
  const k = mokuhyoKeikaku(s, w);
  const herasu = k && k.jotai === "susumu" ? k.shokuCut : (w > s.mokuhyoTaiju ? 400 : 0);
  return Math.round(Math.max(bmr, tdee - herasu) / 10) * 10;
}

/* ---------- 目標（○月○日に○kg）から逆算する ----------
   脂肪1kg ≒ 7200kcal。1日に減らすべきkcalを「食事」と「運動」に分ける。
   安全の目安は週に体重の1%まで。食事は基礎代謝を下回らないようにする。 */
const KCAL_PER_KG = 7200;
function nissuSa(a, b){
  const [y1,m1,d1] = a.split("-").map(Number), [y2,m2,d2] = b.split("-").map(Number);
  return Math.round((new Date(y2,m2-1,d2) - new Date(y1,m1-1,d1)) / 86400000);
}
function kcalPerFun(mets, w){ return mets * w / 60 * 1.05; }
function mokuhyoKeikaku(s, wIma, kyoH){
  if (!s.mokuhyoBi || !s.mokuhyoTaiju) return null;
  const kyo = kyoH || kyoNoHizuke();
  const h = idoHeikin(kyo, 7, "weightKg");
  const w = h.heikin !== null ? h.heikin : wIma;
  const nokoriKg = w - s.mokuhyoTaiju;
  const nissu = nissuSa(kyo, s.mokuhyoBi);
  const base = { w, nokoriKg, nissu, mokuhyoBi:s.mokuhyoBi, mokuhyoTaiju:s.mokuhyoTaiju };
  if (nokoriKg <= 0) return Object.assign(base, { jotai:"tassei" });
  if (nissu <= 0) return Object.assign(base, { jotai:"kigengire" });
  const hitsuyo = nokoriKg * KCAL_PER_KG / nissu;              // 1日に減らすkcal
  const shuPace = nokoriKg / nissu * 7;                         // 週に何kg
  const anzenShu = Math.min(0.75, w * 0.01);                    // 週の安全ペース
  const hayasugi = shuPace > anzenShu;
  const anzenBi = hizukeZurasu(kyo, Math.ceil(nokoriKg / anzenShu * 7));
  const tdee = shohiKcal(s, w), bmr = kisoTaisha(s, w);
  const shokuMax = Math.max(0, Math.min(500, tdee - bmr));      // 食事で減らせる上限
  const shokuCut = Math.round(Math.min(shokuMax, hitsuyo / 2) / 10) * 10;
  const undou = Math.max(0, Math.round((hitsuyo - shokuCut) / 10) * 10);
  const fun = mets => Math.ceil(undou / kcalPerFun(mets, w) / 5) * 5;
  const nawa10 = kcalPerFun(METS.nawatobi, w) * 10;
  const kumiSuburi = Math.max(0, Math.ceil((undou - nawa10) / kcalPerFun(METS.suburi, w) / 5) * 5);
  // ここ7日の運動の平均
  let g = 0; for (let i = 1; i <= 7; i++) g += kcalUndou(kirokuToru(hizukeZurasu(kyo, -i)), w);
  const heikinUndou = Math.round(g / 7);
  // ここ2週間の7日平均の変化から、このままのペースを見る
  const mae = idoHeikin(hizukeZurasu(kyo, -14), 7, "weightKg").heikin;
  let yosokuBi = null, shuJissai = null;
  if (mae !== null && h.heikin !== null){
    shuJissai = (mae - h.heikin) / 2;                             // 週あたり
    if (shuJissai > 0.05) yosokuBi = hizukeZurasu(kyo, Math.ceil(nokoriKg / shuJissai * 7));
  }
  return Object.assign(base, { jotai:"susumu", hitsuyo:Math.round(hitsuyo), shuPace, anzenShu, hayasugi, anzenBi,
    shokuCut, undou, suburiFun:fun(METS.suburi), nawaFun:fun(METS.nawatobi), walkFun:fun(3.5), kumiSuburi,
    heikinUndou, yosokuBi, shuJissai });
}
function hizukeMijikai(h){ const [, m, d] = h.split("-"); return `${Number(m)}月${Number(d)}日`; }
function keikakuHtml(k){
  if (!k) return `<p class="hint" style="margin:0">「何月何日に何kg」を決めると、1日に必要な運動と食事の目安を出します。</p>
    <button class="btn btn-sub mt12" id="mokuhyoSettei">目標を決める</button>`;
  const ue = `<div class="mk-ue"><span class="mk-hi">${hizukeMijikai(k.mokuhyoBi)}</span>に<span class="mk-kg">${su1(k.mokuhyoTaiju)}kg</span></div>`;
  if (k.jotai === "tassei") return ue + `<p class="ok-msg">目標を達成しています（7日平均 ${su1(k.w)}kg）。次の目標を決めましょう。</p><button class="btn btn-sub mt8" id="mokuhyoSettei">目標を変える</button>`;
  if (k.jotai === "kigengire") return ue + `<p class="chosei">目標の日を過ぎました（あと ${su1(k.nokoriKg)}kg）。日付を決め直しましょう。</p><button class="btn btn-sub mt8" id="mokuhyoSettei">目標を決め直す</button>`;
  const tarinai = k.undou - k.heikinUndou;
  return ue + `
    <div class="kumi-retsu">
      <dl class="kumi"><dt>あと</dt><dd>${su1(k.nokoriKg)}kg</dd></dl>
      <dl class="kumi"><dt>残り</dt><dd>${k.nissu}日</dd></dl>
      <dl class="kumi"><dt>必要なペース</dt><dd>週${su1(k.shuPace)}kg</dd></dl>
    </div>
    ${k.hayasugi ? `<p class="chosei itami">このペースは速すぎます（安全の目安は週${su1(k.anzenShu)}kgまで）。無理なく届くのは${hizukeMijikai(k.anzenBi)}ごろです。日付を延ばすのがおすすめです。</p>` : ""}

function kyoNoMenu(h, s){
  const kihon = s.shukan[yobiBango(h)] || { suburi:15, nawatobi:5 };
  let suburi = kihon.suburi, nawatobi = kihon.nawatobi;
  const riyu = [];
  let kaifuku = false, itamiAri = false, kakuninMachi = false, itamiBui = [];

  const zen = kirokuToru(hizukeZurasu(h, -1));
  if (zen){
    if (zen.fatigue === 4){
      suburi = Math.round(suburi * 0.8); nawatobi = Math.round(nawatobi * 0.8);
      riyu.push("昨日の疲労度4のため20%減らしています。");
    } else if (zen.fatigue === 5){
      kaifuku = true; riyu.push("昨日の疲労度5。今日は回復日がおすすめです。");
    }
    const itami = zen.pain || [];
    if (itami.length && !kaifuku){
      itamiBui = itami;
      const k = taichoYomu();
      if (k === null) kakuninMachi = true;
      else if (k === "yasumu"){ kaifuku = true; riyu.push("「今日は休みたい」を選んだので回復日にしています。"); }
      else if (k === "daijobu"){ riyu.push("「もう大丈夫」と回答したので通常メニューです。"); }
      else if (k === "mada_itai"){
        itamiAri = true;
        const c = itamiChosei({ suburi, nawatobi }, itami);
        suburi = c.suburi; nawatobi = c.nawatobi; riyu.push(...c.msg);
        const zz = kirokuToru(hizukeZurasu(h, -2));
        if (zz && (zz.pain||[]).length){
          suburi = Math.min(suburi, kihon.suburi);
          riyu.push("痛みが2日続いているので、増やさず様子を見ています。");

  }
  if (kaifuku){ suburi = 0; nawatobi = 0; }
  return { suburi, nawatobi, riyu, kaifuku, itamiAri, kakuninMachi, itamiBui };
}

function renzokuNissu(){

function heatmapDeta(shuu){
  const kyo = kyoNoHizuke();
  const y = yobiBango(kyo);
  const getsu = hizukeZurasu(kyo, y === 0 ? -6 : -(y - 1));
  const hajime = hizukeZurasu(getsu, -(shuu - 1) * 7);
  const out = [];
  for (let w = 0; w < shuu; w++){
    for (let i = 0; i < 7; i++){
      const d = hizukeZurasu(hajime, w*7 + i);
      out.push({ h:d, fun:goukeiFun(kirokuToru(d)), kyo:d === kyo, mirai:d > kyo });
    }
  }
  return out;
}
function funLv(f){ return f <= 0 ? 0 : f < 15 ? 1 : f < 30 ? 2 : f < 50 ? 3 : 4; }
function keiretsu(metric, nissu){
  const kyo = kyoNoHizuke();
  const hajime = hizukeZurasu(kyo, -(nissu - 1));
  const ten = [];
  for (let i = 0; i < nissu; i++){
    const d = hizukeZurasu(hajime, i);
    const r = kirokuToru(d);
    let a = null;
    if (metric === "goukei") a = r ? goukeiFun(r) : 0;
    else if (metric === "taiju") a = idoHeikin(d, 7, "weightKg").heikin;
    else if (metric === "sesshu") a = (r && (r.meals||[]).length) ? kcalSesshu(r) : null;
    else if (metric === "suburiHonsu") a = (r && typeof r.suburiCount === "number") ? r.suburiCount : (r ? 0 : null);
    else if (metric === "nawaKaisu") a = (r && typeof r.nawatobiCount === "number") ? r.nawatobiCount : (r ? 0 : null);
    ten.push({ h:d, a });
  }
  return ten;
}
function zenkikanNissu(){
  const keys = Object.keys(kirokuZenbu());
  if (!keys.length) return 30;
  const k0 = keys.reduce((a,b) => a < b ? a : b);
  const [y1,m1,d1] = k0.split("-").map(Number);
  const [y2,m2,d2] = kyoNoHizuke().split("-").map(Number);
  return Math.max(7, Math.round((new Date(y2,m2-1,d2) - new Date(y1,m1-1,d1)) / 86400000) + 1);
}
function chartSvg(ten, iro){
  const W = 300, H = 110, Y = 12;
  const yuko = ten.filter(t => t.a !== null && t.a !== undefined);
  if (yuko.length < 2) return null;
  const vs = yuko.map(t => t.a);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mn === mx){ mn -= 1; mx += 1; }
  const n = ten.length;
  const x = i => (i / (n - 1)) * W;
  const y = v => H - Y - ((v - mn) / (mx - mn)) * (H - Y*2);
  let d = ""; const pts = [];
  ten.forEach((t,i) => {
    if (t.a === null || t.a === undefined) return;
    const px = x(i), py = y(t.a);
    d += (d ? " L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
    pts.push({ px, py, last:i === n - 1 });
  });
  return { W, H, d, pts, iro, saishin:yuko[yuko.length-1].a };
}

/* ---------- 画像の縮小 ---------- */
function gazoShukusho(file, maxPx, q){
  return new Promise((ok, ng) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxPx / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

/* ---------- AI連携 ----------
   ふだんは設定画面に貼ったGeminiのAPIキーで、iPhoneから直接呼ぶ。
   キーはiPhoneの中（このアプリの保存領域）にだけ置き、GitHubには載らない。
   以前のGAS経由の設定が残っている場合は、それも使える。 */
const KITEI_MODEL = "gemini-flash-lite-latest";
function aiTsukaeru(s){ s = s || setteiYomu(); return !!(s.geminiKey || (s.gasUrl && s.gasToken)); }

/* 通信：まずふつうの方法で送り、ブラウザに止められたら（事前チェックが要らない）
   簡単な形式で送り直す。うまくいった方法は覚えておく。 */
let tsushinHoho = null;
const JIKANGIRE_BYO = 25;   // 1回の待ち時間の上限（秒）。超えたら次のモデルへ
async function tsushin(url, key, body){
  const yobu = (u, opt) => {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), JIKANGIRE_BYO * 1000);
    return fetch(u, Object.assign({ signal:ac.signal }, opt)).finally(() => clearTimeout(t));
  };
  const hohoA = () => yobu(url, { method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key":key }, body:JSON.stringify(body) });
  const hohoB = () => yobu(url + "?key=" + encodeURIComponent(key), { method:"POST", body:JSON.stringify(body) });
  if (tsushinHoho === "B") return hohoB();
  try{ const r = await hohoA(); tsushinHoho = "A"; return r; }
  catch(e1){
    if (e1 && e1.name === "AbortError") throw e1;   // 時間切れは送り直さず次のモデルへ
    const r = await hohoB(); tsushinHoho = "B"; return r;
  }
}

/* 混雑（503など）や使えないモデル（404）のときは、次のモデルに切り替えて試す */
/* 速さ優先：軽いモデルから。考える時間（thinking）は最小にする */
const KAWARI_MODELS = ["gemini-flash-lite-latest", "gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"];
function kangaeSettei(m){
  return /^gemini-2\.5/.test(m) ? { thinkingBudget:0 } : { thinkingLevel:"minimal" };
}
let saigoModel = null;
async function geminiYobu(parts, key, model, json){
  const junban = [];
  [model, ...KAWARI_MODELS].forEach(m => { if (m && !junban.includes(m)) junban.push(m); });
  let saigo = 0;
  for (const m of junban){
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(m) + ":generateContent";
    const body = { contents:[{ parts }], generationConfig:{ temperature:0.2, maxOutputTokens:1200, thinkingConfig:kangaeSettei(m) } };
    if (json) body.generationConfig.responseMimeType = "application/json";
    let kaisu = m === junban[0] ? 2 : 1;        // 1つ目のモデルだけ1回やり直す
    for (let i = 0; i < kaisu; i++){
      let res;
      try{
        res = await tsushin(url, key, body);
      }catch(e){
        if (e && e.name === "AbortError"){ saigo = "時間切れ"; break; }   // 遅すぎる → 次のモデルへ
        throw new Error("通信できませんでした（" + (e && e.message || "不明") + "）。電波を確認し、広告ブロックなどのアプリを使っていれば一度オフにして試してください。");
      }
      if (res.ok){
        const j = await res.json();
        const c = (j.candidates || [])[0];
        if (!c || !c.content || !c.content.parts) break;   // 答えが空なら次のモデルへ
        saigoModel = m;
        return c.content.parts.map(x => x.text || "").join("");
      }
      saigo = res.status;
      if (res.status === 400 || res.status === 401 || res.status === 403){
        let shosai = "";
        try{ const ej = await res.json(); shosai = (ej.error && ej.error.message) || ""; }catch{}
        // このモデルが「考える時間」の設定を受け付けないときは、設定を外して送り直す
        if (res.status === 400 && /think/i.test(shosai) && body.generationConfig.thinkingConfig){
          delete body.generationConfig.thinkingConfig; kaisu++; continue;
        }
        if (/api key|API_KEY|permission|PERMISSION/i.test(shosai) || res.status !== 400)
          throw new Error("APIキーが使えないようです。設定タブで貼り直してください。" + (shosai ? "（" + shosai.slice(0, 80) + "）" : ""));
        throw new Error("AIに受け付けてもらえませんでした（" + res.status + "：" + shosai.slice(0, 80) + "）。");
      }
      if (res.status === 404) break;                       // このモデルは使えない → 次へ
      if (res.status === 429 || res.status >= 500){
        if (i < kaisu - 1){ await new Promise(r => setTimeout(r, 1500)); continue; }
        break;                                             // 混雑が続く → 次のモデルへ
      }
      throw new Error("AIでエラーが起きました（" + res.status + "）。");
    }
  }
  if (saigo === 429) throw new Error("無料枠の上限に達したようです。しばらく（翌日まで）時間をおいて試してください。カロリーを手で入れて記録することもできます。");
  if (saigo === "時間切れ") throw new Error("AIの返事が遅く、時間切れになりました。電波のよい所で、画面を開いたままもう一度押してください。書いた内容は残っています。");
  throw new Error("AIが混み合っています（" + (saigo || "応答なし") + "）。数分おいてもう一度押してください。カロリーを手で入れて記録することもできます。");
}

    ' "goukeiKcal":数値, "kcalMin":数値, "kcalMax":数値,',

function shokujiKekkaSeiri(text){
  let out;
  try{ out = JSON.parse(String(text).replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim()); }
  catch{ throw new Error("AIの答えを読み取れませんでした。もう一度試してください。"); }
  const num = v => { const n = Math.round(Number(v)); return isFinite(n) && n >= 0 ? n : 0; };
  const ryori = (Array.isArray(out.ryori) ? out.ryori : []).map(x => ({ name:String(x.name || "料理"), ryo:String(x.ryo || ""), kcal:num(x.kcal) }));
  let goukei = num(out.goukeiKcal);
  if (!goukei && ryori.length) goukei = ryori.reduce((a, x) => a + x.kcal, 0);
  return { ok:true, ryori, goukeiKcal:goukei, kcalMin:num(out.kcalMin), kcalMax:num(out.kcalMax),
    pfc: out.pfc ? { p:num(out.pfc.p), f:num(out.pfc.f), c:num(out.pfc.c) } : null, advice:String(out.advice || "") };
}

async function gasYobu(payload, url, token){
  const s = setteiYomu();

  if (!u) throw new Error("設定タブでAI連携のURLを入れてください。");
  let res;

  }catch{ throw new Error("通信できませんでした。電波やURLを確認してください。"); }
  let j;
  try{ j = await res.json(); }catch{ throw new Error("応答を読み取れませんでした。GASの公開設定（全員）を確認してください。"); }
  if (!j.ok) throw new Error(j.error || "エラーが起きました。");

}

function pi(hz){

let shusei = null;       // 過去の記録の修正の下書き
let setteiDraft = null, setteiMsg = null, setteiErr = null, setteiTestChu = false;
let suiiMetric = "goukei", suiiKikan = "1kagetsu";
let tasseiIma = false, intervalMae = -1;
let teibanKiroku_msg = null, shokujiMsg = null;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function su1(n){ return Number(n).toFixed(1); }
function fugo(n){ return (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toFixed(1); }
function seisu(v, kitei){ const n = parseInt(v, 10); return isFinite(n) && n >= 0 ? n : kitei; }
function shosu(v){ const n = parseFloat(v); return isFinite(n) ? Math.round(n * 10) / 10 : null; }
function $(id){ return document.getElementById(id); }
function on(id, ev, fn){ const el = $(id); if (el) el.addEventListener(ev, fn); }
function onAll(sel, ev, fn){ app.querySelectorAll(sel).forEach(el => el.addEventListener(ev, () => fn(el))); }
function timerTomeru(){ if (timerId){ clearInterval(timerId); timerId = null; } }

function hyouji(){
  timerTomeru();
  document.body.classList.toggle("overlay", !!overlay);
  document.body.classList.toggle("kettei", overlay === "shokujiAdd");
  if (overlay === "undou") egakuUndou();
  else if (overlay === "shuryo") egakuShuryo();
  else if (overlay === "shusei") egakuShusei();
  else if (overlay === "shokujiAdd") egakuShokujiAdd();
  else if (overlay === "teibanHenshu") egakuTeibanHenshu();
  else if (tab === "shokuji") egakuShokuji();
  else if (tab === "suii") egakuSuii();
  else if (tab === "settei") egakuSettei();
  else egakuHome();
  egakuTabbar();
}

const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  shokuji:'<svg viewBox="0 0 24 24"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>',
  suii:'<svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 16l5-6 4 4 7-8"/></svg>',
  settei:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>'
};
function egakuTabbar(){
  if (overlay){ tabbarEl.className = "tabbar kakusu"; tabbarEl.innerHTML = ""; return; }
  tabbarEl.className = "tabbar";
  const t = [["home","ホーム"],["shokuji","食事"],["suii","推移"],["settei","設定"]];
  tabbarEl.innerHTML = `<div class="tabbar-uchi">${t.map(([k,l]) =>
    `<button data-tab="${k}" class="${tab===k?'eranda':''}">${ICON[k]}<span>${l}</span></button>`).join("")}</div>`;
  tabbarEl.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    tab = b.dataset.tab; teibanKiroku_msg = null; shokujiMsg = null;
    if (tab === "shokuji") shokujiHizuke = shokujiHizuke || kyoNoHizuke();
    if (tab === "settei") { setteiDraft = null; setteiMsg = null; setteiErr = null; }
    hyouji(); window.scrollTo(0,0);
  }));
}
function header(){
  return `<div class="app-header"><span class="app-title">BOKUTO</span><span class="app-version">v${APP_VERSION}</span></div>`;
}

/* ---------- ホーム ---------- */
function egakuHome(){
  const s = setteiYomu();
  const kyo = kyoNoHizuke();
  const r = kirokuToru(kyo);
  const taiju = r && typeof r.weightKg === "number" ? r.weightKg : null;
  const waist = r && typeof r.waistCm === "number" ? r.waistCm : null;
  const w = genzaiTaiju(kyo);

  let ses = sessionYomu();
  if (ses && ses.date !== kyo){ sessionKaku(null); ses = null; }

  const menu = kyoNoMenu(kyo, s);
  const yasumi = menu.suburi === 0 && menu.nawatobi === 0;

  const heikin = idoHeikin(kyo, 7, "weightKg");
  const senshu = idoHeikin(hizukeZurasu(kyo, -7), 7, "weightKg");
  const sa = (heikin.heikin !== null && senshu.heikin !== null) ? heikin.heikin - senshu.heikin : null;
  const nokori = heikin.heikin !== null ? heikin.heikin - s.mokuhyoTaiju : null;
  const waistH = idoHeikin(kyo, 7, "waistCm");

  const meyasu = mokuhyoKcal(s, w);

  const waku = meyasu + undouK;
  const ritsu = Math.min(100, Math.round(tabeta / waku * 100));
  const nokoriK = waku - tabeta;

  const y = yobiBango(kyo);
  const getsu = hizukeZurasu(kyo, y === 0 ? -6 : -(y - 1));
  const hibi = Array.from({length:7}, (_,i) => {
    const d = hizukeZurasu(getsu, i);
    const f = goukeiFun(kirokuToru(d));
    return { d, yobi:YOBI[yobiBango(d)], f, kyo:d === kyo, mirai:d > kyo };
  });

  const wv = waistNyu !== null ? waistNyu : (waist !== null ? su1(waist) : "");

  app.innerHTML = `
  ${header()}
  <p class="hizuke">${hizukeHyoji(kyo)}</p>

  ${ses ? `<div class="saikai"><p>運動の途中です</p><button class="btn-mini" id="saikaiBtn">再開する</button></div>` : ""}
  ${draftYomu() ? `<div class="saikai shoku"><p>書きかけの食事があります</p><button class="btn-mini" id="draftBtn">続ける</button></div>` : ""}

  <section class="card">
    <h2 class="midashi">今日の運動</h2>
    ${menu.kakuninMachi ? `

        <div class="btns">

          <button class="btn btn-sub" data-kotae="mada_itai">まだ少し痛い</button>
          <button class="btn btn-sub c-dim" data-kotae="yasumu">今日は休みたい</button>
        </div>
      </div>` : yasumi ? `

      <button class="btn btn-sub mt12" id="kaishiBtn">それでも少し動く</button>` : `
      <div class="menu-gyo"><span>木刀素振り</span><span class="atai ${menu.suburi?'c-suburi':'c-dim'}">${menu.suburi ? menu.suburi + "分" : "休み"}</span></div>
      <div class="menu-gyo"><span>縄跳び</span><span class="atai ${menu.nawatobi?'c-nawa':'c-dim'}">${menu.nawatobi ? menu.nawatobi + "分" : "休み"}</span></div>
      ${menu.riyu.length ? `<p class="chosei ${menu.itamiAri?'itami':''}">${menu.riyu.map(esc).join("<br>")}</p>` : ""}
      <button class="btn btn-main mt12" id="kaishiBtn">運動をはじめる</button>
      <p class="hint">目安の時間は「ここまでやればOK」の線です。疲れたらいつでも止めて大丈夫。</p>`}

  <section class="card">
    <h2 class="midashi">目標までの作戦</h2>

  </section>

  <section class="card">
    <h2 class="midashi">今日のカロリー</h2>
    <div class="kcal-ue"><span class="ookii">${tabeta}</span><span class="chiisai">/ ${waku} kcal</span></div>
    <div class="bar ${tabeta > waku ? 'over':''}"><i style="width:${ritsu}%"></i></div>
    <div class="kcal-shita">
      <span>目安 ${meyasu}${undouK ? ` ＋ 運動 ${undouK}` : ""}</span>
      <span>${nokoriK >= 0 ? `あと ${nokoriK}` : `${-nokoriK} オーバー`}</span>
    </div>

      `<button class="teiban-btn" data-teiban-kyo="${t.id}"><span>${esc(t.namae)}</span><span class="num">${kcalHyoji(t.kcal)}</span></button>`).join("")}</div>
      <p class="hint">定番は1タップで今日の食事に記録されます。</p>` : ""}
    ${teibanKiroku_msg ? `<p class="ok-msg">${esc(teibanKiroku_msg)}</p>` : ""}
    <button class="btn btn-shoku mt12" id="shokujiAddBtn">食事を記録する</button>

  <section class="card">
    <h2 class="midashi">体重</h2>
    <div class="taiju-retsu">

    </div>
    ${heikin.heikin !== null ? `
    <div class="kumi-retsu">
      <dl class="kumi"><dt>7日平均</dt><dd>${su1(heikin.heikin)}</dd></dl>

      ${nokori !== null ? `<dl class="kumi"><dt>目標${su1(s.mokuhyoTaiju)}まで</dt><dd>${nokori > 0 ? su1(nokori) : "達成"}</dd></dl>` : ""}

    <div class="nyuryoku mt12">
      <input id="taijuNyu" class="num" type="number" inputmode="decimal" step="0.1" value="${esc(tv)}" placeholder="––.–" aria-label="体重（kg）">
      <span class="tani">kg</span>
      <button class="btn-mini" id="taijuBtn">${taiju !== null ? "書き直す" : "記録"}</button>
    </div>
    <div class="bunkatsu">
      <div class="nyuryoku">
        <input id="waistNyu" class="num" type="number" inputmode="decimal" step="0.1" value="${esc(wv)}" placeholder="––.–" aria-label="ウエスト（cm）">
        <span class="tani">cm ウエスト${waistH.heikin !== null ? `（7日平均 ${su1(waistH.heikin)}）` : ""}</span>
        <button class="btn-mini sub" id="waistBtn">${waist !== null ? "書き直す" : "記録"}</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="midashi">ほかにした運動</h2>
    ${(r && (r.sonota||[]).length) ? r.sonota.map(x => `
      <div class="sonota-gyo"><span>${esc(sonotaInfo(x.shurui).t)}　<span class="num">${x.fun}分</span></span>
      <button class="batsu" data-sonota-del="${x.id}" aria-label="削除">×</button></div>`).join("") : `<p class="hint" style="margin:0">ウォーキングなど、素振り・縄跳び以外に動いた分を足せます。</p>`}
    <div class="sonota-add">
      <select id="sonotaSel" class="field">${SONOTA_SHURUI.map(x => `<option value="${x.v}" ${sonotaSentaku===x.v?'selected':''}>${x.t}</option>`).join("")}</select>
      <input id="sonotaFun" class="field num" type="number" inputmode="numeric" min="1" value="${esc(sonotaFunNyu)}" placeholder="分">
      <button class="btn-mini" id="sonotaBtn">追加</button>
    </div>
  </section>

  <section class="card">
    <h2 class="midashi">今週</h2>
    <div class="masu">${hibi.map(h => `
      <div class="hi ${h.f > 0 ? 'jisshi':''} ${h.kyo?'kyo':''}" ${h.mirai ? "" : `data-hizuke="${h.d}"`}>
        <div class="yobi">${h.yobi}</div>
        <div class="shirushi">${h.f > 0 ? Math.round(h.f) : h.mirai ? "" : "・"}</div>
      </div>`).join("")}</div>
    <p class="hint">日付をタップすると、その日の記録を直せます。</p>
  </section>

  <p class="chui">体重は水分で日に±0.5kgほど動きます。見るのは7日平均です。カロリーはすべて目安です。
  ${Kioku.tsukaeru ? "" : "<br>この画面では記録が保存されません。"}</p>
  `;

  on("saikaiBtn", "click", () => { overlay = "undou"; hyouji(); });
  on("draftBtn", "click", () => { const dr = draftYomu(); if (dr) shokujiAddHiraku(dr.h || kyo, dr); });
  on("mokuhyoSettei", "click", () => { tab = "settei"; setteiDraft = null; setteiMsg = null; setteiErr = null; hyouji(); window.scrollTo(0,0); });
  onAll("[data-kotae]", "click", b => { taichoKaku(b.dataset.kotae); hyouji(); });
  on("kaishiBtn", "click", () => undouKaishi(menu));
  on("shokujiAddBtn", "click", () => { teibanKiroku_msg = null; shokujiAddHiraku(kyo); });
  onAll("[data-teiban-kyo]", "click", b => {
    const t = teibanList().find(x => x.id === b.dataset.teibanKyo); if (!t) return;
    teibanKiroku(t, kyo);
    teibanKiroku_msg = `「${t.namae}」を記録しました（取り消しは食事タブで削除）`;
    hyouji();
  });
  on("taijuNyu", "input", e => { taijuNyu = e.target.value; });
  on("taijuBtn", "click", () => {
    const v = shosu($("taijuNyu").value);
    if (v === null || v < 20 || v > 250){ $("taijuNyu").focus(); return; }
    kirokuKaku(kyo, { weightKg:v });
    const zen = Object.values(kirokuZenbu()).filter(x => typeof x.weightKg === "number").length;
    if (zen === 1){ const s2 = setteiYomu(); s2.kaishiTaiju = v; s2.kaishiBi = kyo; setteiKaku(s2); }
    taijuNyu = null; hyouji();
  });
  on("waistNyu", "input", e => { waistNyu = e.target.value; });
  on("waistBtn", "click", () => {
    const v = shosu($("waistNyu").value);
    if (v === null || v < 40 || v > 200){ $("waistNyu").focus(); return; }
    kirokuKaku(kyo, { waistCm:v }); waistNyu = null; hyouji();
  });
  on("sonotaSel", "change", e => { sonotaSentaku = e.target.value; });
  on("sonotaFun", "input", e => { sonotaFunNyu = e.target.value; });
  on("sonotaBtn", "click", () => {
    const f = seisu($("sonotaFun").value, 0);
    if (!f){ $("sonotaFun").focus(); return; }
    const cur = kirokuToru(kyo);
    const list = (cur && cur.sonota) ? cur.sonota.slice() : [];
    list.push({ id:shinId(), shurui:sonotaSentaku, fun:f });
    kirokuKaku(kyo, { sonota:list }); sonotaFunNyu = ""; hyouji();
  });
  onAll("[data-sonota-del]", "click", b => {
    const cur = kirokuToru(kyo);
    kirokuKaku(kyo, { sonota:(cur.sonota||[]).filter(x => x.id !== b.dataset.sonotaDel) }); hyouji();
  });
  onAll(".hi[data-hizuke]", "click", b => shuseiHiraku(b.dataset.hizuke));
}

/* ---------- 運動 ---------- */
function undouKaishi(menu){
  otoJunbi();
  const kyo = kyoNoHizuke();
  const phase = menu.suburi > 0 || menu.nawatobi === 0 ? "suburi" : "nawatobi";
  sessionKaku({
    date:kyo, phase,
    suburiClock:{ acc:0, since: phase === "suburi" ? Date.now() : null },
    nawaClock:  { acc:0, since: phase === "nawatobi" ? Date.now() : null },
    suburiCount:0, nawaCount:0,
    menuSuburi:menu.suburi, menuNawa:menu.nawatobi,
    suburiFlash:false, nawaFlash:false
  });
  intervalMae = -1;
  overlay = "undou"; hyouji(); window.scrollTo(0,0);
}
function phaseKirikae(p){
  const s = sessionYomu(); if (!s || s.phase === p) return;
  otoJunbi();
  const ugoiteta = s.phase === "suburi" ? !!s.suburiClock.since : !!s.nawaClock.since;
  s.suburiClock = tomeru(s.suburiClock); s.nawaClock = tomeru(s.nawaClock);
  s.phase = p;
  if (ugoiteta){ if (p === "suburi") s.suburiClock = ugokasu(s.suburiClock); else s.nawaClock = ugokasu(s.nawaClock); }
  intervalMae = -1;
  sessionKaku(s); hyouji();
}
function egakuUndou(){
  const s = sessionYomu();
  if (!s){ overlay = null; hyouji(); return; }
  const st = setteiYomu();
  const isS = s.phase === "suburi";
  const clock = isS ? s.suburiClock : s.nawaClock;
  const ms = keika(clock);
  const ugoku = !!clock.since;
  const mokuhyo = isS ? s.menuSuburi : s.menuNawa;
  const goal = mokuhyo * 60000;
  const iro = isS ? "var(--suburi)" : "var(--nawa)";
  const deg = goal > 0 ? Math.round(Math.min(1, ms / goal) * 360) : 0;

  tasseiIma = false;
  const fk = isS ? "suburiFlash" : "nawaFlash";
  if (goal > 0 && ms >= goal && !s[fk]){ s[fk] = true; sessionKaku(s); tasseiIma = true; pi(1320); }

  let intervalHtml = "";
  if (!isS && st.nawaInterval){
    const sec = Math.floor(ms / 1000);
    const idx = Math.floor(sec / 30);
    const tobu = idx % 2 === 0;
    const nokori = 30 - (sec % 30);
    if (ugoku && intervalMae !== -1 && idx !== intervalMae) pi(tobu ? 880 : 520);
    intervalMae = idx;
    intervalHtml = `<div class="interval ${tobu?'tobu':'yasumu'}">${tobu ? "跳ぶ" : "休む"}　${nokori}</div>`;
  }

  const cnt = isS ? s.suburiCount : s.nawaCount;
  const steps = [10, 50, 100];
  const parts = tasseiIma ? Array.from({length:14}, (_,i) => `<div class="particle" style="--ang:${Math.round(i*360/14)}deg"></div>`).join("") : "";

  app.innerHTML = `
  <div class="gamen-head"><span class="gamen-title">運動中</span></div>
  <div class="phase-tabs">
    <button class="phase-tab ${isS?'on-suburi':''}" data-phase="suburi">木刀素振り</button>
    <button class="phase-tab ${!isS?'on-nawa':''}" data-phase="nawatobi">縄跳び</button>
  </div>
  <div class="undou">
    <div class="ring-wrap">
      <div class="ring" style="background:conic-gradient(${iro} ${deg}deg, rgba(255,255,255,.07) ${deg}deg)"></div>
      <div class="ring-uchi">
        <div class="taimaa" style="color:${iro}">${funByou(ms)}</div>
        <p class="mokuhyo">${mokuhyo ? `目安 ${mokuhyo}分` : "目安なし（自由に）"}</p>
      </div>
      <div class="particle-layer">${parts}</div>
    </div>
    ${intervalHtml}
    ${tasseiIma ? `<div><span class="tassei">目安達成！</span></div>` : ""}
    <div class="kazu" style="color:${iro}">${cnt}${isS ? "本" : "回"}</div>
    <div class="kazu-btns">${steps.map(n => `<button data-add="${n}">＋${n}</button>`).join("")}</div>
    <div class="kazu-btns minus">${steps.map(n => `<button data-add="-${n}">－${n}</button>`).join("")}</div>
    <p class="hint">数えられたときだけでOK。${!isS ? "膝や足首に違和感が出たら、すぐやめましょう。" : ""}</p>
    <div class="sosa">
      <button class="btn btn-sub" id="ichijiBtn">${ugoku ? "一時停止" : "再開"}</button>
      <button class="btn btn-warn" id="owariBtn">運動を終える</button>
    </div>
  </div>`;

  onAll("[data-phase]", "click", b => phaseKirikae(b.dataset.phase));
  onAll("[data-add]", "click", b => {
    const s2 = sessionYomu(); if (!s2) return;
    const k = s2.phase === "suburi" ? "suburiCount" : "nawaCount";
    s2[k] = Math.max(0, s2[k] + Number(b.dataset.add)); sessionKaku(s2); hyouji();
  });
  on("ichijiBtn", "click", () => {
    otoJunbi();
    const s2 = sessionYomu(); if (!s2) return;
    const k = s2.phase === "suburi" ? "suburiClock" : "nawaClock";
    s2[k] = s2[k].since ? tomeru(s2[k]) : ugokasu(s2[k]);
    sessionKaku(s2); hyouji();
  });
  on("owariBtn", "click", () => {
    const s2 = sessionYomu(); if (!s2) return;
    s2.suburiClock = tomeru(s2.suburiClock); s2.nawaClock = tomeru(s2.nawaClock); sessionKaku(s2);
    shuryo = {
      suburiMin:String(Math.round(s2.suburiClock.acc / 60000)),
      suburiCount:s2.suburiCount ? String(s2.suburiCount) : "",
      nawaMin:String(Math.round(s2.nawaClock.acc / 60000)),
      nawaCount:s2.nawaCount ? String(s2.nawaCount) : "",
      fatigue:null, pain:[]
    };
    overlay = "shuryo"; hyouji(); window.scrollTo(0,0);
  });
  if (ugoku) timerId = setInterval(() => { if (overlay === "undou") hyouji(); }, 1000);
}

/* ---------- 終了記録 ---------- */
const HIROU = [{v:1,t:"余裕"},{v:2,t:"軽い"},{v:3,t:"ふつう"},{v:4,t:"強い"},{v:5,t:"かなり"}];
const ITAMI = [
  {v:"kata_migi",t:"右肩"},{v:"kata_hidari",t:"左肩"},{v:"hiji_migi",t:"右肘"},{v:"hiji_hidari",t:"左肘"},
  {v:"tekubi_migi",t:"右手首"},{v:"tekubi_hidari",t:"左手首"},{v:"koshi",t:"腰"},
  {v:"hiza_migi",t:"右膝"},{v:"hiza_hidari",t:"左膝"},{v:"ashikubi_migi",t:"右足首"},{v:"ashikubi_hidari",t:"左足首"},
  {v:"sonota",t:"その他"}
];
function itamiHyoji(codes){ return (codes||[]).map(c => (ITAMI.find(i => i.v === c) || {t:c}).t).join("・"); }
function hirouHtml(sel){

}
function itamiToggle(list, v){ const i = list.indexOf(v); if (i >= 0) list.splice(i,1); else list.push(v); }

  on("shModoru", "click", () => { shuryo = null; overlay = "undou"; hyouji(); });
  on("shHozon", "click", () => {
    const cur = kirokuToru(s.date) || {};

    kirokuKaku(s.date, {

/* ---------- 食事 ---------- */
const KUBUN = [{v:"asa",t:"朝"},{v:"hiru",t:"昼"},{v:"yoru",t:"夜"},{v:"kanshoku",t:"間食"}];
function kubunT(v){ return (KUBUN.find(k => k.v === v) || {t:""}).t; }
function kubunJidou(){
  const h = new Date().getHours();
  return h < 10 ? "asa" : h < 15 ? "hiru" : h < 17 ? "kanshoku" : "yoru";
}

function egakuShokuji(){

  const waku = mokuhyoKcal(s, w) + kcalUndou(r, w);

  const minyu = meals.filter(m => !kcalAri(m.kcal)).length;

  app.innerHTML = `
  ${header()}
  ${shokujiMsg ? `<p class="ok-msg">${esc(shokujiMsg)}</p>` : ""}
  <div class="hi-nav">
    <button id="mPrev" aria-label="前の日">‹</button>

  </div>
  <section class="card">
    <div class="kcal-ue"><span class="ookii">${tabeta}</span><span class="chiisai">/ ${waku} kcal（運動分を含む目安）</span></div>

  </section>
  <section class="card">
    <h2 class="midashi">記録した食事</h2>
    ${meals.length ? meals.map(m => `
      <div class="meal">
        ${m.thumb ? `<img class="meal-thumb" src="${m.thumb}" alt="">` : `<div class="meal-thumb">${esc(kubunT(m.kubun))}</div>`}
        <div class="meal-hon">
          <div class="meal-ue"><span class="meal-namae">${esc(m.namae || "食事")}</span><span class="meal-kcal ${kcalAri(m.kcal) ? "" : "minyu"}">${kcalHyoji(m.kcal)}</span></div>
          <div class="meal-sub">${esc(kubunT(m.kubun))}　${esc(m.jikan || "")}</div>
          ${m.advice ? `<div class="meal-adv">${esc(m.advice)}</div>` : ""}
          <div class="meal-sosa">

            ${mealTeiban(m) ? `<button data-m-tb="${mealTeiban(m).id}">定番のkcalを変える</button>` : ""}
            <button data-m-del="${m.id}">削除</button>
          </div>
        </div>
      </div>`).join("") : `<p class="hint" style="margin:0">まだありません。写真を撮るか、カロリーを手で入れて記録できます。</p>`}
  </section>`;

  on("mPrev", "click", () => { shokujiHizuke = hizukeZurasu(h, -1); hyouji(); });

  on("mAdd", "click", () => shokujiAddHiraku(h));

  });
  onAll("[data-m-tb]", "click", b => teibanHenshuHiraku(b.dataset.mTb, "shokuji"));
  onAll("[data-m-kcal]", "click", b => {
    const cur = kirokuToru(h);
    const m = (cur.meals||[]).find(x => x.id === b.dataset.mKcal); if (!m) return;

function mealTeiban(m){
  const tb = teibanList();
  return tb.find(t => m.teibanId ? t.id === m.teibanId : t.namae === m.namae) || null;
}

/* 書きかけの食事を保存しておく（アプリが閉じても続きから書ける。写真は除く）*/
const KEY_DRAFT = "bokuto.shokujiDraft.v1";
function draftHozon(){
  if (!draft) return;
  const { h, kubun, memo, namae, kcal, teiban } = draft;
  if (!(memo || "").trim() && !(namae || "").trim() && !String(kcal || "").trim()){ Kioku.kaku(KEY_DRAFT, null); return; }
  Kioku.kaku(KEY_DRAFT, { h, kubun, memo, namae, kcal, teiban });
}
function draftKesu(){ Kioku.kaku(KEY_DRAFT, null); }
function draftYomu(){ return Kioku.yomu(KEY_DRAFT, null); }

function shokujiAddHiraku(h, tsuzuki){
  shokujiMsg = null;
  if (tsuzuki){
    draft = Object.assign({ gazo:null, thumb:null, kekka:null, ikko:"", kosu:"", loading:false, err:null, kiku:false }, tsuzuki);
    overlay = "shokujiAdd"; hyouji(); window.scrollTo(0,0); return;
  }
  draftKesu();
  draft = { h, kubun:kubunJidou(), memo:"", gazo:null, thumb:null, kekka:null, namae:"", kcal:"", ikko:"", kosu:"", loading:false, err:null, teiban:false, kiku:false };
  overlay = "shokujiAdd"; hyouji(); window.scrollTo(0,0);
}

/* ---------- 定番の食事（毎日同じものを1タップで）---------- */
function teibanList(){ return setteiYomu().teiban || []; }
function kcalAri(v){ return v !== null && v !== undefined && v !== "" && isFinite(Number(v)); }
function kcalHyoji(v){ return kcalAri(v) ? `${Number(v)}kcal` : "kcal未入力"; }
function teibanKiroku(t, h){
  const cur = kirokuToru(h);
  const meals = (cur && cur.meals) ? cur.meals.slice() : [];
  meals.push({ id:shinId(), jikan: h === kyoNoHizuke() ? jikanMoji() : "", kubun:t.kubun || kubunJidou(),
    namae:t.namae, kcal: kcalAri(t.kcal) ? Number(t.kcal) : null, naiyo:[], advice:"", teibanId:t.id });
  kirokuKaku(h, { meals });
}
/* 定番から記録した食事か（古い記録は名前で見分ける）*/
function teibanNoKiroku(m, t, motoNamae){
  return m.teibanId ? m.teibanId === t.id : (m.namae === motoNamae);
}
/* 定番の名前・kcalを直し、選んだ範囲の過去の記録にも反映する。直した件数を返す */
function teibanKoshin(id, namae, kcal, hani, kara){
  const st = setteiYomu();
  const t = (st.teiban || []).find(x => x.id === id); if (!t) return 0;
  const motoNamae = t.namae;
  t.namae = namae; t.kcal = kcal;
  setteiKaku(st);
  if (hani === "korekara") return 0;
  const zenbu = kirokuZenbu();
  let n = 0;
  Object.keys(zenbu).forEach(h => {
    if (hani === "hizuke" && h < kara) return;
    (zenbu[h].meals || []).forEach(m => {
      if (!teibanNoKiroku(m, t, motoNamae)) return;
      m.kcal = kcal; m.namae = namae; m.teibanId = t.id; n++;
    });
  });
  kirokuHozon(zenbu);
  return n;
}
function teibanTaishoKensu(t, hani, kara){
  if (hani === "korekara") return 0;
  let n = 0;
  Object.entries(kirokuZenbu()).forEach(([h, r]) => {
    if (hani === "hizuke" && h < kara) return;
    (r.meals || []).forEach(m => { if (teibanNoKiroku(m, t, t.namae)) n++; });
  });
  return n;
}

/* ---------- 音声入力（使えない環境ではキーボードのマイクを案内）---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let kikiChu = null;
function onseiKaishi(){
  if (!SR){ alert("この画面では音声認識が使えません。入力欄をタップして、キーボードのマイクボタンで話してください。"); return; }
  if (kikiChu){ try{ kikiChu.stop(); }catch{} return; }
  const r = new SR();
  r.lang = "ja-JP"; r.interimResults = false; r.continuous = false;
  r.onresult = e => {
    const t = Array.from(e.results).map(x => x[0].transcript).join("");
    if (draft){ draft.memo = (draft.memo ? draft.memo + "、" : "") + t; }
  };
  r.onerror = e => { if (draft && e.error !== "aborted") draft.err = "音声を聞き取れませんでした。キーボードのマイクボタンでも話せます。"; };
  r.onend = () => { kikiChu = null; if (draft){ draft.kiku = false; hyouji(); } };
  try{ r.start(); kikiChu = r; draft.kiku = true; draft.err = null; hyouji(); }
  catch{ kikiChu = null; alert("音声認識を始められませんでした。キーボードのマイクボタンで話してください。"); }
}

    ${(k.ryori||[]).map(x => `<div class="kekka-ryori"><span>${esc(x.name)}<span class="ryo">${esc(x.ryo || "")}</span></span><span class="num">${x.kcal}kcal</span></div>`).join("")}
    ${k.pfc ? `<p class="hint">たんぱく質 ${k.pfc.p}g・脂質 ${k.pfc.f}g・炭水化物 ${k.pfc.c}g${k.kcalMin && k.kcalMax ? `／幅 ${k.kcalMin}〜${k.kcalMax}kcal` : ""}</p>` : ""}
    ${k.advice ? `<div class="adv-box">${esc(k.advice)}</div>` : ""}
    <button class="link-btn mt8" id="daAiSaido">内容を直したので、もう一度推定する</button>
  </section>` : ""}

  <section class="card">
    <h2 class="midashi"><span class="step">2</span>カロリー</h2>
    <div class="kcal-nyu">
      <input class="field num" id="daKcal" type="number" inputmode="numeric" value="${esc(d.kcal)}" placeholder="—">
      <span class="tani">kcal</span>
    </div>
    ${aiOk ? `<p class="hint">分からなければ空のままで、下のボタンを押すとAIが出します。</p>`
           : `<p class="hint">袋の裏の「1個あたり」のカロリーが一番正確です。</p>`}
    <div class="keisan">
      <span>1個</span><input class="field num" id="daIkko" type="number" inputmode="numeric" value="${esc(d.ikko || "")}" placeholder="kcal">
      <span>×</span><input class="field num" id="daKosu" type="number" inputmode="numeric" value="${esc(d.kosu || "")}" placeholder="個">
      <button class="btn-mini sub" id="daKeisan">計算</button>
    </div>
    <div class="gyo mt8"><label>料理名</label><input class="field" id="daNamae" style="width:62%;font-size:14px;text-align:left" value="${esc(d.namae)}" placeholder="空なら①の文が入ります"></div>
    ${aiOk ? `<button class="link-btn" id="daAtode">AIを使わず、kcalはあとで入れて記録する</button>` : ""}
    <label class="check mt12"><input type="checkbox" id="daTeiban" ${d.teiban?'checked':''}> 定番に登録する（次からホームの1タップで記録）</label>
    ${d.err ? `<p class="err">${esc(d.err)}</p>` : ""}
  </section>

  <div class="kettei-bar">
    <p id="ketteiHint">${esc(btnHint)}</p>
    <button class="btn ${kcalOk ? 'btn-accent' : 'btn-shoku'}" id="daKettei" ${d.loading ? "disabled" : ""}><span class="step-w">3</span>${esc(btnLabel)}</button>
  </div>`;

  on("daModoru", "click", () => {
    if (kikiChu){ try{ kikiChu.abort(); }catch{} }
    if ((draft.memo || "").trim() && !confirm("書いた内容を消して戻りますか？")) return;
    draftKesu(); draft = null; overlay = null; hyouji();
  });
  onAll("[data-kubun]", "click", b => { draft.kubun = b.dataset.kubun; hyouji(); });
  onAll("[data-teiban]", "click", b => {
    const t = teibanList().find(x => x.id === b.dataset.teiban); if (!t) return;
    draft.namae = t.namae; draft.kcal = kcalAri(t.kcal) ? String(t.kcal) : ""; draft.teibanId = t.id; if (t.kubun) draft.kubun = t.kubun; draft.kekka = null; draft.err = null; hyouji();
  });
  on("daMemo", "input", e => { draft.memo = e.target.value; ketteiKoshin(); });
  on("daMemo", "change", () => hyouji());
  on("daMic", "click", onseiKaishi);
  on("daNamae", "input", e => { draft.namae = e.target.value; });
  on("daKcal", "input", e => { draft.kcal = e.target.value; draft.err = null; ketteiKoshin(); });
  on("daKcal", "change", () => hyouji());
  on("daIkko", "input", e => { draft.ikko = e.target.value; });
  on("daKosu", "input", e => { draft.kosu = e.target.value; });
  on("daKeisan", "click", () => {
    const a = seisu(draft.ikko, -1), n = seisu(draft.kosu, -1);
    if (a < 0 || n <= 0){ draft.err = "1個あたりのkcalと個数を入れてください。"; hyouji(); return; }
    draft.kcal = String(a * n); draft.err = null; hyouji();
  });
  on("daTeiban", "change", e => { draft.teiban = e.target.checked; hyouji(); });
  on("daFile", "change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try{
      draft.gazo = await gazoShukusho(f, 768, 0.7);
      draft.thumb = await gazoShukusho(f, 200, 0.6);
      draft.kekka = null; draft.err = null;
    }catch(err){ draft.err = err.message; }
    hyouji();
  });
  on("daAiSaido", "click", () => aiSuitei());
  on("daAtode", "click", () => {
    if ($("daMemo")) draft.memo = $("daMemo").value;
    if ($("daNamae")) draft.namae = $("daNamae").value;
    if (!(draft.gazo || draft.memo.trim() || draft.namae.trim())){ draft.err = "食べたものを話すか書いてください。"; hyouji(); return; }
    draft.kcal = ""; shokujiHozon();
  });
  on("daKettei", "click", () => {
    // 入力途中の値を取りこぼさない
    if ($("daMemo")) draft.memo = $("daMemo").value;
    if ($("daKcal")) draft.kcal = $("daKcal").value;
    if ($("daNamae")) draft.namae = $("daNamae").value;
    const ok = String(draft.kcal).trim() !== "" && seisu(draft.kcal, -1) >= 0;
    const st = setteiYomu();
    if (ok){ shokujiHozon(); return; }
    if (aiTsukaeru(st) && (draft.gazo || draft.memo.trim())){ aiSuitei(); return; }
    if (draft.gazo || draft.memo.trim() || draft.namae.trim()){ shokujiHozon(); return; }
    draft.err = "食べたものを話すか書いてください。";
    hyouji();
    const el = $("daMemo"); if (el) el.focus();
  });
}

/* 下の決定ボタン：いま押すと何が起きるかを表示する */
function ketteiJotai(d, aiOk){
  const kcalOk = String(d.kcal).trim() !== "" && seisu(d.kcal, -1) >= 0;
  const naiyoAri = !!(d.gazo || d.memo.trim());
  let btnLabel, btnHint;
  if (d.loading){ btnLabel = "推定しています…"; btnHint = "画面を開いたままお待ちください（ほかのアプリに切り替えると止まります）"; }
  else if (kcalOk){ btnLabel = `記録する（${seisu(d.kcal,0)}kcal）`; btnHint = d.teiban ? "記録して、定番にも登録します" : "押すと記録されます"; }
  else if (aiOk && naiyoAri){ btnLabel = "AIでカロリーを出す"; btnHint = "出たカロリーを確かめてから記録します"; }
  else if (naiyoAri || d.namae.trim()){ btnLabel = "記録する（kcalはあとで）"; btnHint = "②を空のまま記録して、あとから入れられます"; }
  else { btnLabel = "記録する"; btnHint = "まず、食べたものを話すか書いてください"; }
  return { kcalOk, btnLabel, btnHint };
}
function ketteiKoshin(){
  if (!draft) return;
  draftHozon();
  const s = setteiYomu();
  const j = ketteiJotai(draft, aiTsukaeru(s));
  const b = $("daKettei"), p = $("ketteiHint");
  if (b){ b.innerHTML = `<span class="step-w">3</span>${esc(j.btnLabel)}`; b.className = "btn " + (j.kcalOk ? "btn-accent" : "btn-shoku"); }
  if (p) p.textContent = j.btnHint;
}

async function aiSuitei(){
  if (!draft) return;
  if ($("daMemo")) draft.memo = $("daMemo").value;
  const st = setteiYomu();
  const w = genzaiTaiju(draft.h);
  const r = kirokuToru(draft.h);
  draft.loading = true; draft.err = null; hyouji();
  const t0 = Date.now();
  const byoTimer = setInterval(() => {
    const b = $("daKettei"); if (!b || !draft || !draft.loading){ clearInterval(byoTimer); return; }
    b.innerHTML = `<span class="step-w">3</span>推定しています…${Math.floor((Date.now() - t0) / 1000)}秒`;
  }, 1000);
  try{
    const payload = {
      action:"meal",
      memo: draft.memo, kubun: kubunT(draft.kubun),
      profile:{
        seibetsu: st.seibetsu === "josei" ? "女性" : "男性",
        nenrei: st.nenrei, shinchoCm: st.shinchoCm, taijuKg: w, mokuhyoTaiju: st.mokuhyoTaiju,
        mokuhyoKcal: mokuhyoKcal(st, w), kyoSesshu: kcalSesshu(r), kyoUndou: kcalUndou(r, w)
      }
    };
    if (draft.gazo){ payload.image = draft.gazo.split(",")[1]; payload.mimeType = "image/jpeg"; }
    const j = await aiYobu(payload);
    if (!draft) return;
    draft.kekka = j;
    draft.namae = (j.ryori || []).map(x => x.name).join("・");
    draft.kcal = String(j.goukeiKcal ?? "");
  }catch(err){ if (draft) draft.err = err.message + (/手で入れて/.test(err.message) ? "" : "　カロリーを手で入れても記録できます。"); }
  clearInterval(byoTimer);
  if (draft){ draft.loading = false; hyouji(); window.scrollTo(0, document.body.scrollHeight); }
}

function shokujiHozon(){
  const n = String(draft.kcal).trim() === "" ? null : seisu(draft.kcal, -1);
  if (n !== null && n < 0) return;
  const memo1 = draft.memo.trim().split(/\n/)[0].slice(0, 40);
  const namae = draft.namae.trim() || memo1 || kubunT(draft.kubun) + "の食事";
  let teibanId = draft.teibanId && teibanList().some(t => t.id === draft.teibanId && t.namae === namae) ? draft.teibanId : null;
  if (draft.teiban){
    const st = setteiYomu();
    st.teiban = st.teiban || [];
    const aru = st.teiban.find(t => t.namae === namae);
    if (aru){ aru.kcal = n; aru.kubun = draft.kubun; teibanId = aru.id; }
    else { teibanId = shinId(); st.teiban.push({ id:teibanId, namae, kcal:n, kubun:draft.kubun }); }
    setteiKaku(st);
  }
  const cur = kirokuToru(draft.h);
  const meals = (cur && cur.meals) ? cur.meals.slice() : [];
  meals.push({
    id:shinId(), jikan: draft.h === kyoNoHizuke() ? jikanMoji() : "", kubun:draft.kubun,
    namae, kcal:n, teibanId: teibanId || undefined,
    naiyo: draft.kekka ? (draft.kekka.ryori || []) : [],
    advice: draft.kekka ? (draft.kekka.advice || "") : "",
    thumb: draft.thumb || undefined
  });
  kirokuKaku(draft.h, { meals });
  shokujiMsg = `「${namae}」${n === null ? "（kcalはあとで）" : n + "kcal"} を記録しました。`;
  if (draft.teiban) shokujiMsg += "定番にも登録したので、次からはホームのボタンを1回押すだけで記録できます。";
  thumbSeiri();
  draftKesu();
  shokujiHizuke = draft.h; draft = null; overlay = null; tab = "shokuji"; hyouji(); window.scrollTo(0,0);
}

/* ---------- 定番の編集（kcalを直して、過去の記録にも反映）---------- */
let tbh = null;

  const t = teibanList().find(x => x.id === id); if (!t) return;

}
function egakuTeibanHenshu(){
  const d = tbh;

  const kensu = teibanTaishoKensu(t, d.hani, d.kara);
  const [, m, dd] = d.kara.split("-");
  app.innerHTML = `
  <div class="gamen-head"><button class="modoru" id="thModoru">← やめる</button><span class="gamen-title">定番を直す</span></div>
  <section class="card">

    <div class="keisan">
      <span>1個</span><input class="field num" id="thIkko" type="number" inputmode="numeric" placeholder="kcal">
      <span>×</span><input class="field num" id="thKosu" type="number" inputmode="numeric" placeholder="個">
      <button class="btn-mini sub" id="thKeisan">計算</button>
    </div>
  </section>
  <section class="card">
    <h2 class="midashi">どの記録に反映する？</h2>
    <label class="radio"><input type="radio" name="hani" value="zenbu" ${d.hani==='zenbu'?'checked':''}> これまでの記録すべて</label>
    <label class="radio"><input type="radio" name="hani" value="hizuke" ${d.hani==='hizuke'?'checked':''}> この日から
      <input class="field" id="thKara" type="date" value="${esc(d.kara)}" max="${kyoNoHizuke()}" ${d.hani==='hizuke'?'':'disabled'}></label>
    <label class="radio"><input type="radio" name="hani" value="korekara" ${d.hani==='korekara'?'checked':''}> これからの記録だけ</label>
    <p class="hint">${d.hani === "korekara" ? "過去の記録は変わりません。" : `${d.hani === "hizuke" ? `${Number(m)}月${Number(dd)}日以降の` : "これまでの"}記録 ${kensu}件 が直ります。`}
    値上げで中身が小さくなったときは「この日から」が便利です。</p>
    ${d.err ? `<p class="err">${esc(d.err)}</p>` : ""}
  </section>
  <button class="btn btn-accent mt16" id="thHozon">保存する</button>`;

  on("thModoru", "click", () => { const m2 = tbh.modori; tbh = null; overlay = null; tab = m2; hyouji(); });
  on("thNamae", "input", e => { tbh.namae = e.target.value; });
  on("thKcal", "input", e => { tbh.kcal = e.target.value; });
  on("thKeisan", "click", () => {
    const a = seisu($("thIkko").value, -1), n = seisu($("thKosu").value, -1);
    if (a < 0 || n <= 0){ tbh.err = "1個あたりのkcalと個数を入れてください。"; hyouji(); return; }
    tbh.kcal = String(a * n); tbh.err = null; hyouji();
  });
  app.querySelectorAll('input[name="hani"]').forEach(el => el.addEventListener("change", () => { tbh.hani = el.value; hyouji(); }));
  on("thKara", "change", e => { if (e.target.value) tbh.kara = e.target.value; hyouji(); });
  on("thHozon", "click", () => {
    const namae = tbh.namae.trim();
    if (!namae){ tbh.err = "名前を入れてください。"; hyouji(); return; }
    const v = String(tbh.kcal).trim();
    const kcal = v === "" ? null : seisu(v, -1);
    if (kcal !== null && kcal < 0){ tbh.err = "カロリーを確認してください。"; hyouji(); return; }
    const n = teibanKoshin(tbh.id, namae, kcal, tbh.hani, tbh.kara);
    const msg = `定番「${namae}」を${kcal === null ? "kcal未入力" : kcal + "kcal"}にしました。` + (tbh.hani === "korekara" ? "次の記録から使われます。" : `記録${n}件も直しました。`);
    const m2 = tbh.modori; tbh = null; overlay = null; tab = m2;
    if (m2 === "settei"){ setteiMsg = msg; setteiErr = null; } else { shokujiMsg = msg; }
    hyouji(); window.scrollTo(0,0);
  });
}

/* ---------- 推移 ---------- */
const SHIHYO = {
  goukei:{ t:"運動時間", tani:"分", iro:"suburi" },
  taiju:{ t:"体重", tani:"kg", iro:"accent" },
  sesshu:{ t:"食べたkcal", tani:"kcal", iro:"shoku" },
  suburiHonsu:{ t:"素振り本数", tani:"本", iro:"suburi" },
  nawaKaisu:{ t:"縄跳び回数", tani:"回", iro:"nawa" }
};
const KIKAN = { "2shukan":{ t:"2週間", n:14 }, "1kagetsu":{ t:"1ヶ月", n:30 }, "zenkikan":{ t:"全期間", n:null } };
function egakuSuii(){
  const n = KIKAN[suiiKikan].n || zenkikanNissu();
  const sh = SHIHYO[suiiMetric];
  const zu = chartSvg(keiretsu(suiiMetric, n), `var(--${sh.iro})`);
  const hm = heatmapDeta(16);
  app.innerHTML = `
  ${header()}
  <section class="card renzoku"><div class="kazu-ookii">${renzokuNissu()}</div><p>日連続で運動中</p></section>
  <section class="card">
    <h2 class="midashi">日々の運動量</h2>
    <div class="heatmap-wrap"><div class="heatmap">${hm.map(x =>
      `<div class="hc l${funLv(x.fun)} ${x.kyo?'kyo':''} ${x.mirai?'mirai':''}" ${x.mirai ? "" : `data-hizuke="${x.h}"`}></div>`).join("")}</div></div>
    <div class="hanrei"><span>少</span><div class="hc"></div><div class="hc l1"></div><div class="hc l2"></div><div class="hc l3"></div><div class="hc l4"></div><span>多</span></div>

    <div class="tabs-sm mt8">${Object.entries(KIKAN).map(([k,v]) => `<button data-kikan="${k}" class="${suiiKikan===k?'eranda':''}">${v.t}</button>`).join("")}</div>
    <div class="chart mt12">${zu ? `
      <div class="chart-ue"><span>${n}日間</span><span class="ima">${Math.round(zu.saishin * 10) / 10}${sh.tani}</span></div>
      <svg viewBox="0 0 ${zu.W} ${zu.H}" preserveAspectRatio="none">

  </section>`;
  onAll(".hc[data-hizuke]", "click", b => shuseiHiraku(b.dataset.hizuke, "suii"));
  onAll("[data-metric]", "click", b => { suiiMetric = b.dataset.metric; hyouji(); });
  onAll("[data-kikan]", "click", b => { suiiKikan = b.dataset.kikan; hyouji(); });
}

      <select class="field" data-sd="seibetsu"><option value="dansei" ${d.seibetsu==='dansei'?'selected':''}>男性</option><option value="josei" ${d.seibetsu==='josei'?'selected':''}>女性</option></select></div>
    <div class="settei-gyo"><label>ふだんの活動量</label>
      <select class="field" data-sd="katsudo">${Object.entries(KATSUDO).map(([k,v]) => `<option value="${k}" ${d.katsudo===k?'selected':''}>${v.t}</option>`).join("")}</select></div>
