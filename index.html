    <h2 class="midashi">運動</h2>
    <div class="settei-gyo"><label>縄跳びの合図（30秒跳ぶ・30秒休む）</label>
      <button class="chip ${d.nawaInterval?'eranda':''}" id="sdInterval">${d.nawaInterval ? "オン" : "オフ"}</button></div>
  </section>

  <section class="card">
    <h2 class="midashi">AI（食事のカロリー推定）</h2>
    <div class="settei-tate"><label>GeminiのAPIキー（Google AI Studioでコピーして貼り付け）</label>
      <input class="field" data-sd="geminiKey" type="password" value="${esc(d.geminiKey)}" placeholder="AIza…" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <button class="btn btn-sub mt12" id="sdTest" ${setteiTestChu ? "disabled" : ""}>${setteiTestChu ? "確認中…" : "キーを試す"}</button>
    <p class="hint">キーはこのiPhoneの中にだけ保存され、GitHubには載りません。人に見せないでください。</p>
    <details class="shosai mt8"><summary>詳しい設定</summary>
      <div class="settei-tate"><label>モデル名（ふだんは空でOK：${KITEI_MODEL}）</label><input class="field" data-sd="geminiModel" type="text" value="${esc(d.geminiModel)}" placeholder="${KITEI_MODEL}" autocapitalize="off" autocorrect="off"></div>
      <div class="settei-tate"><label>GASのURL（以前の方式。キーを貼ったなら不要）</label><input class="field" data-sd="gasUrl" type="url" value="${esc(d.gasUrl)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></div>
      <div class="settei-tate"><label>GASの合言葉</label><input class="field" data-sd="gasToken" type="text" value="${esc(d.gasToken)}" autocapitalize="off" autocorrect="off"></div>
    </details>
  </section>

  <section class="card">
    <h2 class="midashi">定番の食事</h2>
    ${(s.teiban||[]).length ? s.teiban.map(t => `<div class="sonota-gyo"><button class="tb-gyo" data-tb-edit="${t.id}"><span>${esc(t.namae)}</span><span class="num ${kcalAri(t.kcal)?'':'c-shoku'}">${kcalHyoji(t.kcal)}　直す ›</span></button><button class="batsu" data-tb-del="${t.id}" aria-label="削除">×</button></div>`).join("")
      : `<p class="hint" style="margin:0">食事を記録するとき「定番に登録する」にチェックすると、ここに並びます。</p>`}
  </section>

  <section class="card">
    <h2 class="midashi">見た目</h2>
    <div class="chip-retsu">
      <button class="chip ${s.colorTeema==='sawayaka'?'eranda':''}" data-teema="sawayaka">爽やか</button>
      <button class="chip ${s.colorTeema==='hade'?'eranda':''}" data-teema="hade">派手</button>
    </div>
  </section>

  ${setteiMsg ? `<p class="ok-msg">${esc(setteiMsg)}</p>` : ""}
  ${setteiErr ? `<p class="err">${esc(setteiErr)}</p>` : ""}
  <button class="btn btn-accent mt16" id="sdHozon">設定を保存する</button>
  <p class="chui">記録はこのiPhoneの中（ホーム画面のアイコンから開いたアプリ）に保存されています。Safariのタブで開くと別の保存場所になるので、いつもアイコンから開いてください。食事写真の縮小版は直近14日分だけ残します。</p>`;

  app.querySelectorAll("[data-sd]").forEach(el => {
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", e => {
      setteiDraft[el.dataset.sd] = e.target.value;
      if (el.tagName === "SELECT") hyouji();
    });
    if (el.tagName === "INPUT") el.addEventListener("change", () => hyouji());
  });
  on("sdInterval", "click", () => { setteiDraft.nawaInterval = !setteiDraft.nawaInterval; hyouji(); });
  onAll("[data-teema]", "click", b => { const s2 = setteiYomu(); s2.colorTeema = b.dataset.teema; setteiKaku(s2); teemaTekiyou(s2.colorTeema); hyouji(); });
  onAll("[data-tb-edit]", "click", b => teibanHenshuHiraku(b.dataset.tbEdit, "settei"));
  onAll("[data-tb-del]", "click", b => {
    if (!confirm("この定番を削除しますか？（これまでの食事の記録は残ります）")) return;
    const s2 = setteiYomu(); s2.teiban = (s2.teiban||[]).filter(t => t.id !== b.dataset.tbDel); setteiKaku(s2); hyouji();
  });
  on("sdTest", "click", async () => {
    setteiTestChu = true; setteiMsg = null; setteiErr = null; hyouji();
    try{
      const key = setteiDraft.geminiKey.trim();
      if (key){
        const t = await geminiYobu([{ text:"「OK」とだけ返してください。" }], key, setteiDraft.geminiModel.trim(), false);
        setteiMsg = `AIにつながりました（モデル：${saigoModel}／通信方法${tsushinHoho}）。「設定を保存する」を押してください。`;
      } else if (setteiDraft.gasUrl.trim()){
        const j = await gasYobu({ action:"ping" }, setteiDraft.gasUrl.trim(), setteiDraft.gasToken.trim());
        setteiMsg = j.keyAri ? `GASにつながりました（モデル：${j.model}）。「設定を保存する」を押してください。` : "GASにはつながりましたが、GEMINI_API_KEY が未設定です。";
      } else {
        throw new Error("APIキーを貼り付けてください。");
      }
    }catch(err){ setteiErr = err.message; }
    setteiTestChu = false; hyouji();
  });
  on("sdHozon", "click", () => {
    const s2 = setteiYomu();
    const sc = shosu(d.shinchoCm), mt = shosu(d.mokuhyoTaiju), nn = seisu(d.nenrei, -1);
    if (!sc || sc < 100 || sc > 230){ setteiErr = "身長を確認してください。"; setteiMsg = null; hyouji(); return; }
    if (!mt || mt < 30 || mt > 200){ setteiErr = "目標体重を確認してください。"; setteiMsg = null; hyouji(); return; }
    if (nn < 10 || nn > 110){ setteiErr = "年齢を確認してください。"; setteiMsg = null; hyouji(); return; }
    if (d.mokuhyoBi && d.mokuhyoBi <= kyoNoHizuke()){ setteiErr = "目標の日は明日以降にしてください。"; setteiMsg = null; hyouji(); return; }
    Object.assign(s2, { shinchoCm:sc, mokuhyoTaiju:mt, mokuhyoBi:d.mokuhyoBi || "", nenrei:nn, seibetsu:d.seibetsu, katsudo:d.katsudo,
      nawaInterval:!!d.nawaInterval, geminiKey:d.geminiKey.trim(), geminiModel:d.geminiModel.trim(),
      gasUrl:d.gasUrl.trim(), gasToken:d.gasToken.trim() });
    setteiKaku(s2);
    setteiMsg = "保存しました。"; setteiErr = null; hyouji();
  });
}

/* ---------- 起動 ---------- */
teemaTekiyou(setteiYomu().colorTeema);
thumbSeiri();
hyouji();
</script>
</body>
</html>
