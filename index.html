<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="素振り">
<meta name="theme-color" content="#0A0D13">
<title>素振り＋一段昇降</title>
<style>
:root{
  --bg:#0A0D13;
  --bg2:#0F131C;
  --panel:#141924;
  --panel2:#1B2130;
  --line:rgba(255,255,255,.09);
  --text:#EAF0FA;
  --text-dim:#7C87A0;
  --suburi:#00F0C0;
  --suburi-dim:rgba(0,240,192,.14);
  --shoko:#FF7A45;
  --shoko-dim:rgba(255,122,69,.14);
  --warn:#FF3D6E;
  --warn-dim:rgba(255,61,110,.13);
  --accent:#7C5CFF;
  --accent-dim:rgba(124,92,255,.15);
  --gold:#FFD166;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--gothic)}
body{
  font-size:15px;line-height:1.7;
  padding:0 18px calc(48px + env(safe-area-inset-bottom));
  max-width:30rem;margin:0 auto;
  background:
    radial-gradient(ellipse 600px 300px at 20% -5%, var(--suburi-dim), transparent 60%),
    radial-gradient(ellipse 600px 300px at 100% 10%, var(--shoko-dim), transparent 60%),
    var(--bg);
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--suburi);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button{opacity:.5}

.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}

/* ── 日付 ── */
.app-header{
  display:flex;align-items:center;gap:8px;padding:26px 0 0;flex-wrap:wrap;
}
.app-title{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--text-dim)}
.app-version{
  font-family:var(--mono);font-size:11px;color:var(--accent);
  padding:2px 7px;border:1px solid var(--accent);border-radius:10px;
  background:var(--accent-dim);letter-spacing:.02em;
}
.teema-kirikae{display:flex;gap:6px;margin-left:auto}
.teema-kirikae button{
  padding:4px 10px;border-radius:12px;font-size:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--text-dim);letter-spacing:.02em;
}
.teema-kirikae button.eranda{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
.hizuke{
  padding:6px 0 0;font-size:12px;
  color:var(--text-dim);letter-spacing:.22em;text-transform:uppercase;
}

/* ── 再開バナー ── */
.modoshi-banner{
  margin-top:16px;padding:14px 16px;background:var(--accent-dim);
  border:1px solid var(--accent);border-radius:6px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.modoshi-banner p{margin:0;font-size:14px;color:var(--text)}
.modoshi-banner button{padding:9px 18px;background:var(--accent);color:#0A0D13;border-radius:4px;font-size:13px;white-space:nowrap;font-weight:700}

/* ── 体重 ── */
.taiju{padding:16px 0 26px}
.taiju-kazu{
  font-family:var(--mono);font-size:58px;line-height:1;font-weight:700;
  letter-spacing:-.02em;color:var(--text);
  text-shadow:0 0 22px var(--accent-dim);
}
.taiju-kazu .tani{font-size:20px;margin-left:4px;color:var(--text-dim);font-weight:400}
.taiju-mikeisoku{font-size:17px;color:var(--text-dim)}
.taiju-shita{margin-top:14px;display:flex;gap:22px;flex-wrap:wrap}
.kumi{line-height:1.4}
.kumi dt{font-size:11px;color:var(--text-dim);margin:0;letter-spacing:.06em}
.kumi dd{margin:0;font-family:var(--mono);font-size:18px;color:var(--text)}
.kensu{font-size:11px;color:var(--text-dim);font-family:var(--gothic)}

/* ── 入力 ── */
.nyuryoku{display:flex;gap:8px;align-items:center;margin-top:16px}
.nyuryoku input{
  font-family:var(--mono);font-size:22px;width:5.4em;
  padding:8px 10px;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);color:var(--text);text-align:right;
}
.nyuryoku input:focus{border-color:var(--accent)}
.nyuryoku .tani{color:var(--text-dim);font-size:14px}
.hozon{
  margin-left:auto;padding:9px 18px;background:var(--accent);color:#0A0D13;
  border-radius:4px;letter-spacing:.04em;font-weight:700;font-size:13px;
}
.hozon:disabled{background:var(--panel2);color:var(--text-dim);cursor:default}
.yobikake{margin-top:14px;color:var(--text-dim);font-size:12px}

/* ── ウエスト ── */
.uesuto{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.uesuto-atai-retsu{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.uesuto-label{font-size:11px;color:var(--text-dim);letter-spacing:.06em}
.uesuto-genzai{font-family:var(--mono);font-size:22px;color:var(--text)}
.uesuto-genzai small{font-size:13px;color:var(--text-dim);margin-left:2px;font-family:var(--gothic)}
.uesuto-heikin{font-size:11px;color:var(--text-dim)}
.uesuto .nyuryoku{margin-top:10px}

/* ── 仕切り ── */
hr{border:0;border-top:1px solid var(--line);margin:0}

/* ── 今日のメニュー ── */
.kondate{padding:24px 0 0}
.midashi{font-size:12px;margin:0 0 14px;font-weight:700;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase}
.shurui{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.shurui:last-of-type{border-bottom:0}
.shurui .fun{font-family:var(--mono);font-size:19px;font-weight:700}
.shurui .fun.c-suburi{color:var(--suburi)}
.shurui .fun.c-shoko{color:var(--shoko)}
.shurui .nashi{color:var(--warn);font-size:13px;font-family:var(--gothic)}
.chosei{
  margin-top:12px;padding:10px 12px;background:var(--panel);
  border-left:3px solid var(--accent);border-radius:2px;font-size:13px;line-height:1.6;color:var(--text-dim);
}
.chosei.itami{border-left-color:var(--warn);background:var(--warn-dim);color:#FFD5DF}

/* ── 左右モード選択 ── */
.legmode-retsu{display:flex;gap:8px;margin-top:16px}
.legmode-retsu button{
  flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);font-size:13px;color:var(--text-dim);
}
.legmode-retsu button.eranda{background:var(--shoko-dim);border-color:var(--shoko);color:var(--shoko);font-weight:700}
.legmode-chui{margin-top:8px;font-size:12px;color:var(--warn)}

/* ── 開始ボタン ── */
.kaishi{
  display:block;width:100%;margin-top:20px;padding:18px;
  background:linear-gradient(90deg,var(--suburi),var(--shoko));color:#0A0D13;
  border-radius:6px;font-size:16px;letter-spacing:.1em;font-weight:800;
}

/* ── 運動画面 ── */
.undou{padding:20px 0 10px;text-align:center}
.phase-tabs{display:flex;gap:8px;margin-bottom:26px}
.phase-tab{
  flex:1;padding:11px 4px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);font-size:13px;color:var(--text-dim);font-weight:700;letter-spacing:.04em;
}
.phase-tab.active.p-suburi{background:var(--suburi-dim);border-color:var(--suburi);color:var(--suburi);box-shadow:0 0 16px var(--suburi-dim)}
.phase-tab.active.p-shoko{background:var(--shoko-dim);border-color:var(--shoko);color:var(--shoko);box-shadow:0 0 16px var(--shoko-dim)}
.phase-tab:disabled{opacity:.35}

.undou-midashi{font-size:13px;margin:0;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase}
.undou-ashi{margin:6px 0 0;font-size:14px;font-weight:700}
.undou.p-suburi .undou-ashi{color:var(--suburi)}
.undou.p-shoko .undou-ashi{color:var(--shoko)}

.ring-wrap{position:relative;width:236px;height:236px;margin:22px auto 6px}
.ring{position:absolute;inset:0;border-radius:50%}
.ring-inner{
  position:absolute;inset:14px;border-radius:50%;background:var(--bg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--line);
}
.undou-taimaa{
  font-family:var(--mono);font-size:46px;line-height:1;font-weight:700;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.undou.p-suburi .undou-taimaa{color:var(--suburi);text-shadow:0 0 18px var(--suburi-dim)}
.undou.p-shoko .undou-taimaa{color:var(--shoko);text-shadow:0 0 18px var(--shoko-dim)}
.undou-mokuhyo{font-size:12px;color:var(--text-dim);margin:6px 0 0}

.tassei-badge{
  display:inline-block;margin-top:14px;padding:6px 16px;border-radius:20px;
  background:var(--gold);color:#3A2A00;font-size:12px;font-weight:800;letter-spacing:.06em;
  animation:tasseiPop .5s ease;
}
@keyframes tasseiPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.particle-layer{position:absolute;inset:0;pointer-events:none;overflow:visible}
.particle{
  position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;
  background:var(--gold);opacity:0;
  animation:particleFly 900ms ease-out forwards;
}
@keyframes particleFly{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(120px) scale(.3)}
}

.honsu-retsu{margin-top:26px}
.honsu-atai{font-family:var(--mono);font-size:26px;font-weight:700}
.undou.p-suburi .honsu-atai{color:var(--suburi)}
.undou.p-shoko .honsu-atai{color:var(--shoko)}
.kazu-btn-retsu{display:flex;gap:8px;justify-content:center;margin-top:12px}
.kazu-btn-retsu.minus{margin-top:8px}
.kazu-btn-retsu button{
  padding:9px 14px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);font-size:13px;color:var(--text);font-family:var(--mono);
}
.undou.p-suburi .kazu-btn-retsu.plus button{color:var(--suburi);border-color:rgba(0,229,196,.3)}
.undou.p-shoko .kazu-btn-retsu.plus button{color:var(--shoko);border-color:rgba(58,180,255,.3)}
.kazu-btn-retsu.minus button{color:var(--text-dim)}

.sosa-retsu{display:flex;gap:10px;margin-top:36px}
.sosa-retsu button{flex:1;padding:16px;border-radius:6px;font-size:14px;font-weight:700;letter-spacing:.04em}
.ichiji-btn{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.owari-btn{background:var(--warn);color:#fff}

/* ── 終了記録画面 ── */
.shuryo{padding:26px 0}
.shuryo-midashi{font-size:20px;margin:0 0 6px;font-weight:800}
.shuryo-sub{margin:0 0 20px;font-size:12px;color:var(--text-dim);letter-spacing:.1em}
.badge-retsu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.badge{
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:.03em;
  border:1px solid var(--gold);color:var(--gold);background:rgba(255,209,102,.1);
  box-shadow:0 0 14px rgba(255,209,102,.25);
}
.hosei-hint{font-size:11px;color:var(--text-dim);margin:-8px 0 14px}
.kazu-hint{font-size:11px;color:var(--text-dim);margin:10px 0 0}
.shuryo-koumoku{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.shuryo-koumoku .atai{font-family:var(--mono);font-size:17px;color:var(--text)}
.shuryo-koumoku .hosei-nyu{
  width:4em;font-family:var(--mono);font-size:17px;text-align:right;
  padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text);
}
.shuryo-koumoku.c-suburi .hosei-nyu:focus,.shuryo-koumoku.c-suburi .atai{color:var(--suburi)}
.shuryo-koumoku.c-shoko .hosei-nyu:focus,.shuryo-koumoku.c-shoko .atai{color:var(--shoko)}
.shuryo-kcal{margin-top:8px;font-size:12px;color:var(--text-dim)}
.hirou-midashi{margin-top:28px;font-size:12px;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase}
.hirou-retsu{display:flex;gap:6px;margin-top:10px}
.hirou-retsu button{
  flex:1;padding:10px 2px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);font-size:11px;line-height:1.5;color:var(--text-dim);font-family:var(--mono)}
.hirou-retsu button.eranda{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
.itami-midashi{margin-top:26px;font-size:12px;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase}
.itami-retsu{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.itami-chip{padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:13px;color:var(--text-dim)}
.itami-chip.eranda{background:var(--warn-dim);border-color:var(--warn);color:var(--warn);font-weight:700}
.hozon-owari{
  display:block;width:100%;margin-top:32px;padding:17px;
  background:var(--accent);color:#0A0D13;border-radius:6px;
  font-size:15px;letter-spacing:.06em;font-weight:800;
}
.hozon-owari:disabled{background:var(--panel2);color:var(--text-dim)}

/* ── 今週 ── */
.konshu{padding:28px 0 0}
.masu{display:flex;gap:6px;margin:12px 0 0}
.hi{flex:1;text-align:center}
.hi .yobi{font-size:11px;color:var(--text-dim)}
.hi .shirushi{
  margin-top:4px;height:32px;border-radius:6px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;color:var(--text-dim);background:var(--panel);
}
.hi.jisshi .shirushi{background:var(--suburi-dim);border-color:var(--suburi);color:var(--suburi);font-weight:700}
.hi.kyuyo .shirushi{background:var(--panel2);border-color:var(--line);color:var(--text-dim)}
.hi.kyo .shirushi{box-shadow:0 0 12px var(--accent-dim);border-color:var(--accent)}
.hi.kyo .yobi{color:var(--accent);font-weight:700}
.shukei{margin-top:12px;font-size:12px;color:var(--text-dim)}

.chui{margin-top:32px;font-size:11px;color:var(--text-dim);line-height:1.7}
@media (prefers-reduced-motion:no-preference){
  .hozon,.kaishi,.hozon-owari,.phase-tab{transition:opacity .15s,transform .1s}
}
.hozon:active,.kaishi:active,.hozon-owari:active,.phase-tab:active{opacity:.7}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ===========================================================
   木刀素振り＋一段昇降　管理アプリ
   実装3：
   ・運動画面をタブ切替式にし、フェーズの手直し（誤操作の訂正）に対応
   ・回数カウントに「－」ボタンを追加（数え間違いの訂正）
   ・終了記録画面で素振り／昇降の分数を手入力で補正できるように
   ・痛みチェックに左右（右／左）の項目を追加
   ・デザインをダーク×ネオンの引き締まった見た目に刷新、達成演出を追加
   仕様書 v1 準拠。カロリー表示のみ実施、グラム換算はしない（10章）。
   =========================================================== */

/* ---------- 保存層 ------------------------------------------------- */
const Kioku = (() => {
  let tsukaeru = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch { tsukaeru = false; }
  const memori = {};
  return {
    tsukaeru,
    yomu(key, kitei){
      try{
        const s = tsukaeru ? localStorage.getItem(key) : memori[key];
        return s ? JSON.parse(s) : kitei;
      }catch{ return kitei; }
    },
    kaku(key, atai){
      const s = JSON.stringify(atai);
      if (tsukaeru) { try{ localStorage.setItem(key, s); }catch{} }
      else memori[key] = s;
    }
  };
})();

/* ---------- バージョン ----------------------------------------------
   改善のたびにここを更新する。表示はホーム画面のアプリ名の横。
   増分ルール：新機能追加は +0.1、不具合修正のみは +0.0.1
   v1.0  2026-xx-xx  実装1：データ層＋ホーム＋体重入力
   v1.1  2026-xx-xx  実装2：運動画面の追加
   v1.2  2026-09-13  実装3：フェーズ手直しタブ／回数の－ボタン／
                     終了記録の分数手入力補正／痛みチェックの左右項目／
                     ダーク×ネオンのデザイン刷新／達成演出
   v1.3  2026-09-13  配色テーマを「爽やか系」「派手系」の2種類に分け、
                     ホーム画面右上でいつでも切り替え可能に（設定に保存）
   v1.4  2026-09-13  一段昇降にも回数カウント（＋/－ボタン）を追加。
                     素振り・昇降ともに「時間」と「数えられた分の回数」を
                     両方記録できるように（数えにくい時は時間だけでも良い）
   ------------------------------------------------------------------ */
const APP_VERSION = "1.4";

const KEY_KIROKU  = "bokuto.kiroku.v1";
const KEY_SETTEI  = "bokuto.settei.v1";
const KEY_SESSION = "bokuto.session.v2";

/* ---------- 設定 --------------------------------------------------- */
const KITEI_SETTEI = {
  kaishiBi: null,
  kaishiTaiju: 75.0,
  mokuhyoShukan: -1.0,
  kirikaeFun: 1,
  kiteiLegMode: "kogo",
  colorTeema: "sawayaka",   // "sawayaka"（爽やか系）| "hade"（派手系）
  shukan: [
    { suburi:13, shoko:18, sonota:5  },
    { suburi:25, shoko:20, sonota:10 },
    { suburi:20, shoko:25, sonota:10 },
    { suburi:15, shoko:20, sonota:10 },
    { suburi:25, shoko:20, sonota:10 },
    { suburi:20, shoko:25, sonota:10 },
    { suburi:30, shoko:20, sonota:10 },
  ]
};

function setteiYomu(){
  const s = Object.assign({}, KITEI_SETTEI, Kioku.yomu(KEY_SETTEI, {}));
  if (!s.kaishiBi){ s.kaishiBi = kyoNoHizuke(); Kioku.kaku(KEY_SETTEI, s); }
  return s;
}
function setteiKaku(s){ Kioku.kaku(KEY_SETTEI, s); }

/* ---------- 配色テーマ ------------------------------------------------
   「爽やか系」（ターコイズ×スカイブルー×ミント）と
   「派手系」（ライム×マゼンタ×イエロー）の2種類を用意し、
   ホーム画面右上のボタンでいつでも切り替えられる。            */
const TEEMA = {
  sawayaka: {
    suburi:"#00E5C4", suburiDim:"rgba(0,229,196,.16)",
    shoko:"#3AB4FF",  shokoDim:"rgba(58,180,255,.16)",
    accent:"#3DFFB0", accentDim:"rgba(61,255,176,.17)"
  },
  hade: {
    suburi:"#D4FF1F", suburiDim:"rgba(212,255,31,.16)",
    shoko:"#FF2E9C",  shokoDim:"rgba(255,46,156,.17)",
    accent:"#FFDA00", accentDim:"rgba(255,218,0,.17)"
  }
};
function teemaTekiyou(name){
  const t = TEEMA[name] || TEEMA.sawayaka;
  const r = document.documentElement.style;
  r.setProperty("--suburi", t.suburi);
  r.setProperty("--suburi-dim", t.suburiDim);
  r.setProperty("--shoko", t.shoko);
  r.setProperty("--shoko-dim", t.shokoDim);
  r.setProperty("--accent", t.accent);
  r.setProperty("--accent-dim", t.accentDim);
}
function teemaKirikae(name){
  const s = setteiYomu();
  s.colorTeema = name;
  setteiKaku(s);
  teemaTekiyou(name);
  hyouji();
}

/* ---------- 記録 ---------------------------------------------------- */
function kirokuZenbu(){ return Kioku.yomu(KEY_KIROKU, {}); }
function kirokuHozon(zenbu){ Kioku.kaku(KEY_KIROKU, zenbu); }
function kirokuToru(hizuke){ return kirokuZenbu()[hizuke] || null; }

function kirokuKaku(hizuke, henko){
  const zenbu = kirokuZenbu();
  const moto = zenbu[hizuke] || {
    date:hizuke, weightKg:null, waistCm:null, suburiMin:0, suburiCount:null,
    shokoMigiMin:0, shokoHidariMin:0, shokoCount:null, fatigue:null, pain:[], legModeUsed:null
  };
  zenbu[hizuke] = Object.assign(moto, henko);
  kirokuHozon(zenbu);
  return zenbu[hizuke];
}

/* ---------- 運動中セッション ----------------------------------------
   v2：素振り・昇降それぞれが自分の時計を持ち、タブでいつでも
   行き来できる。誤って進めてしまっても、タブで戻せば良い。      */
function sessionYomu(){ return Kioku.yomu(KEY_SESSION, null); }
function sessionKaku(s){ Kioku.kaku(KEY_SESSION, s); }

function keiKaishi(){ return { accumulatedMs:0, runningSince: Date.now() }; }
function keiKeika(clock){
  if (!clock) return 0;
  return clock.accumulatedMs + (clock.runningSince ? (Date.now() - clock.runningSince) : 0);
}
function keiIchiji(clock){
  if (!clock || !clock.runningSince) return clock;
  return { accumulatedMs: keiKeika(clock), runningSince: null };
}
function keiSaikai(clock){
  if (!clock || clock.runningSince) return clock;
  return { accumulatedMs: clock.accumulatedMs, runningSince: Date.now() };
}

/* 一段昇降の左右振り分け（切替間隔ごとに右→左を交互に）。 */
function ashiWake(keikaMs, kirikaeFun, legMode){
  if (legMode === "migi")   return { migiMs: keikaMs, hidariMs: 0, ima: "migi" };
  if (legMode === "hidari") return { migiMs: 0, hidariMs: keikaMs, ima: "hidari" };
  const block = Math.max(1, kirikaeFun) * 60000;
  const kanryo = Math.floor(keikaMs / block);
  const nokori = keikaMs - kanryo * block;
  const migiBlocks = Math.ceil(kanryo / 2);
  const hidariBlocks = Math.floor(kanryo / 2);
  let migiMs = migiBlocks * block;
  let hidariMs = hidariBlocks * block;
  const ima = (kanryo % 2 === 0) ? "migi" : "hidari";
  if (ima === "migi") migiMs += nokori; else hidariMs += nokori;
  return { migiMs, hidariMs, ima };
}

/* 消費カロリーの目安（METs法）。グラム換算はしない。 */
const METS = { suburi: 4.5, shoko: 4.0 };
function kcalMitsumori(suburiMs, shokoMs, weightKg){
  const w = weightKg || 60;
  const h1 = suburiMs / 3600000, h2 = shokoMs / 3600000;
  return Math.round((METS.suburi * w * h1 + METS.shoko * w * h2) * 1.05);
}

/* ---------- 日付ユーティリティ ------------------------------------- */
function kyoNoHizuke(){ return hizukeMoji(new Date()); }
function hizukeMoji(d){
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function hizukeZurasu(moji, nichi){
  const [y,m,d] = moji.split("-").map(Number);
  const dt = new Date(y, m-1, d + nichi);
  return hizukeMoji(dt);
}
function yobiBango(moji){
  const [y,m,d] = moji.split("-").map(Number);
  return new Date(y, m-1, d).getDay();
}
const YOBI = ["日","月","火","水","木","金","土"];

function funByouHyouji(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m}:${String(s).padStart(2,"0")}`;
}

/* ---------- 数値の集計（体重・ウエスト共通）------------------------ */
function idoHeikin(hizuke, nissu = 7, field = "weightKg"){
  const zenbu = kirokuZenbu();
  let goukei = 0, kensu = 0;
  for (let i = 0; i < nissu; i++){
    const r = zenbu[hizukeZurasu(hizuke, -i)];
    if (r && typeof r[field] === "number"){ goukei += r[field]; kensu++; }
  }
  return kensu ? { heikin: goukei / kensu, kensu } : { heikin: null, kensu: 0 };
}
function saishinTaiju(hizuke){
  const zenbu = kirokuZenbu();
  for (let i = 0; i < 30; i++){
    const r = zenbu[hizukeZurasu(hizuke, -i)];
    if (r && typeof r.weightKg === "number") return r.weightKg;
  }
  return null;
}
function suburiCountSaikou(ignoreHizuke){
  const zenbu = kirokuZenbu();
  let saikou = 0;
  for (const k in zenbu){
    if (k === ignoreHizuke) continue;
    const c = zenbu[k].suburiCount;
    if (typeof c === "number" && c > saikou) saikou = c;
  }
  return saikou;
}

/* ---------- 翌日メニュー調整（仕様書9章）---------------------------
   痛み項目は左右（_migi / _hidari）を持つが、部位の判定は
   前方一致でまとめて見る（左右どちらでも同じ扱い）。            */
const ITAMI_UDE  = ["kata","hiji","tekubi"];
const ITAMI_ASHI = ["hiza","ashikubi"];
function budoIchizu(pain, sesshuji){ return sesshuji.some(pref => pain.startsWith(pref)); }

function kyoNoMenu(hizuke, settei){
  const kihon = settei.shukan[yobiBango(hizuke)];
  let suburi = kihon.suburi, shoko = kihon.shoko;
  const riyu = [];
  let kaifukuBi = false, itamiAri = false;

  const zenjitsu = kirokuToru(hizukeZurasu(hizuke, -1));
  if (zenjitsu){
    const f = zenjitsu.fatigue;
    if (f === 4){
      suburi = Math.round(suburi * 0.8); shoko = Math.round(shoko * 0.8);
      riyu.push("昨日の疲労度4のため20%減らしています。");
    } else if (f === 5){
      kaifukuBi = true;
      riyu.push("昨日の疲労度5。今日は回復日をおすすめします。");
    }

    const itami = zenjitsu.pain || [];
    if (itami.some(p => budoIchizu(p, ITAMI_UDE))){
      suburi = 0; itamiAri = true;
      riyu.push("腕・肩に痛みがあったため素振りを止めています。");
    }
    if (itami.some(p => budoIchizu(p, ITAMI_ASHI))){
      shoko = 0; itamiAri = true;
      riyu.push("脚に痛みがあったため一段昇降を止めています。");
    }
    if (itami.includes("koshi")){
      suburi = Math.min(suburi, Math.round(kihon.suburi * 0.5));
      shoko  = Math.min(shoko,  Math.round(kihon.shoko  * 0.5));
      itamiAri = true;
      riyu.push("腰に痛みがあったため両方の負荷を下げています。");
    }

    const zenzenjitsu = kirokuToru(hizukeZurasu(hizuke, -2));
    const tsuzuku = zenzenjitsu && (zenzenjitsu.pain||[]).length && itami.length;
    if (tsuzuku){
      const zenShoko = (zenjitsu.shokoMigiMin||0) + (zenjitsu.shokoHidariMin||0);
      suburi = Math.min(suburi, zenjitsu.suburiMin || 0);
      shoko  = Math.min(shoko,  zenShoko);
      itamiAri = true;
      riyu.push("痛みが続いています。運動量は増やしません。");
    }
  }

  if (kaifukuBi){ suburi = 0; shoko = 0; }
  return { suburi, shoko, sonota: kihon.sonota, riyu, kaifukuBi, itamiAri };
}

/* ---------- 今週の実施状況 ------------------------------------------ */
function konshuNoHi(hizuke){
  const youbi = yobiBango(hizuke);
  const getsuyo = hizukeZurasu(hizuke, youbi === 0 ? -6 : -(youbi - 1));
  const zenbu = kirokuZenbu();
  const hibi = [];
  for (let i = 0; i < 7; i++){
    const d = hizukeZurasu(getsuyo, i);
    const r = zenbu[d];
    const fun = r ? (r.suburiMin||0) + (r.shokoMigiMin||0) + (r.shokoHidariMin||0) : 0;
    hibi.push({
      hizuke: d,
      yobi: YOBI[yobiBango(d)],
      jotai: !r ? "mikiroku" : (fun > 0 ? "jisshi" : "kyuyo"),
      fun,
      kyo: d === hizuke,
      mirai: d > hizuke
    });
  }
  return hibi;
}

/* ---------- 運動画面 -------------------------------------------------
   素振り・昇降それぞれに自分の時計を持たせ、タブでいつでも
   行き来できるようにする。タップ間違いで進んでしまっても、
   もう片方のタブを押せばすぐ戻せる。時間は各フェーズごとに
   独立して積み上がる（行き来しても消えない）。                    */
function undouKaishi(legModeSentaku){
  const kyo = kyoNoHizuke();
  const settei = setteiYomu();
  const menu = kyoNoMenu(kyo, settei);
  const phase = menu.suburi > 0 ? "suburi" : "shoko";
  const session = {
    date: kyo,
    legMode: legModeSentaku,
    phase,
    suburiClock: { accumulatedMs:0, runningSince: phase === "suburi" ? Date.now() : null },
    shokoClock:  { accumulatedMs:0, runningSince: phase === "shoko"  ? Date.now() : null },
    suburiCount: 0,
    shokoCount: 0,
    menuSuburiMin: menu.suburi,
    menuShokoMin: menu.shoko,
    suburiGoalFlashed: false,
    shokoGoalFlashed: false
  };
  sessionKaku(session);
  gamen = "undou";
  hyouji();
}

function phaseKirikae(newPhase){
  const s = sessionYomu(); if (!s || s.phase === newPhase) return;
  if (s.phase === "suburi") s.suburiClock = keiIchiji(s.suburiClock);
  else s.shokoClock = keiIchiji(s.shokoClock);
  s.phase = newPhase;
  if (newPhase === "suburi") s.suburiClock = keiSaikai(s.suburiClock);
  else s.shokoClock = keiSaikai(s.shokoClock);
  sessionKaku(s);
  hyouji();
}

let tasseiEnshutsuChu = false; // 直前の描画で達成演出を出したか（連続で出さないため）

function egakuUndou(){
  undouTaimaaTomeru();
  const s = sessionYomu();
  if (!s){ gamen = "home"; hyouji(); return; }

  const settei = setteiYomu();
  const isSuburi = s.phase === "suburi";
  const clock = isSuburi ? s.suburiClock : s.shokoClock;
  const keika = keiKeika(clock);
  const ugoiteiru = !!(clock && clock.runningSince);
  const mokuhyoFun = isSuburi ? s.menuSuburiMin : s.menuShokoMin;
  const goalMs = mokuhyoFun * 60000;

  const showSuburiTab = s.menuSuburiMin > 0 || (s.suburiClock && s.suburiClock.accumulatedMs > 0);
  const showShokoTab  = s.menuShokoMin  > 0 || (s.shokoClock  && s.shokoClock.accumulatedMs  > 0);

  let ashiHyouji = "";
  if (!isSuburi){
    const wake = ashiWake(keika, settei.kirikaeFun, s.legMode);
    ashiHyouji = wake.ima === "migi" ? "右足先行" : "左足先行";
  }

  /* 目標到達の一度きりの達成演出 */
  let ima_tassei = false;
  if (goalMs > 0 && keika >= goalMs){
    const flagKey = isSuburi ? "suburiGoalFlashed" : "shokoGoalFlashed";
    if (!s[flagKey]){ s[flagKey] = true; sessionKaku(s); ima_tassei = true; }
  }

  const ringIro = isSuburi ? "var(--suburi)" : "var(--shoko)";
  const ratio = goalMs > 0 ? Math.min(1, keika / goalMs) : 0;
  const deg = Math.round(ratio * 360);

  const particles = ima_tassei
    ? Array.from({length:14}).map((_,i) => `<div class="particle" style="--ang:${Math.round(i*(360/14))}deg;animation-delay:${(i%4)*40}ms"></div>`).join("")
    : "";

  app.innerHTML = `
    <div class="undou ${isSuburi ? 'p-suburi' : 'p-shoko'}">
      ${(showSuburiTab && showShokoTab) ? `
      <div class="phase-tabs">
        <button class="phase-tab p-suburi ${isSuburi ? 'active' : ''}" id="tabSuburi">木刀素振り</button>
        <button class="phase-tab p-shoko ${!isSuburi ? 'active' : ''}" id="tabShoko">一段昇降</button>
      </div>` : ""}

      <p class="undou-midashi">${isSuburi ? "木刀素振り" : "一段昇降"}</p>
      ${!isSuburi ? `<p class="undou-ashi">${ashiHyouji}</p>` : ""}

      <div class="ring-wrap">
        <div class="ring" style="background:conic-gradient(${ringIro} ${deg}deg, rgba(255,255,255,.07) ${deg}deg)"></div>
        <div class="ring-inner">
          <p class="undou-taimaa">${funByouHyouji(keika)}</p>
          <p class="undou-mokuhyo">目安 ${mokuhyoFun}分</p>
        </div>
        <div class="particle-layer">${particles}</div>
      </div>
      ${ima_tassei ? `<div class="tassei-badge">目標達成！</div>` : ""}

      <p class="honsu-retsu"><span class="honsu-atai">${isSuburi ? s.suburiCount : s.shokoCount}${isSuburi ? "本" : "回"}</span></p>
      <div class="kazu-btn-retsu plus">
        ${(isSuburi ? [10,50,100] : [1,10,50]).map(n => `<button data-add="${n}">＋${n}</button>`).join("")}
      </div>
      <div class="kazu-btn-retsu minus">
        ${(isSuburi ? [10,50,100] : [1,10,50]).map(n => `<button data-add="${-n}">－${n}</button>`).join("")}
      </div>
      ${isSuburi ? "" : `<p class="kazu-hint">歩いたりして数えられない時は、無理に数えず時間だけ記録すればOKです。</p>`}
      <div class="sosa-retsu">
        <button id="ichijiBtn" class="ichiji-btn">${ugoiteiru ? "一時停止" : "再開"}</button>
        <button id="owariBtn" class="owari-btn">運動を終える</button>
      </div>
    </div>
  `;

  if (showSuburiTab && showShokoTab){
    document.getElementById("tabSuburi").addEventListener("click", () => phaseKirikae("suburi"));
    document.getElementById("tabShoko").addEventListener("click", () => phaseKirikae("shoko"));
  }

  app.querySelectorAll(".kazu-btn-retsu button").forEach(b => {
    b.addEventListener("click", () => {
      const s2 = sessionYomu(); if (!s2) return;
      const field = isSuburi ? "suburiCount" : "shokoCount";
      s2[field] = Math.max(0, s2[field] + Number(b.dataset.add));
      sessionKaku(s2);
      hyouji();
    });
  });

  document.getElementById("ichijiBtn").addEventListener("click", () => {
    const s2 = sessionYomu(); if (!s2) return;
    if (isSuburi) s2.suburiClock = ugoiteiru ? keiIchiji(s2.suburiClock) : keiSaikai(s2.suburiClock);
    else          s2.shokoClock  = ugoiteiru ? keiIchiji(s2.shokoClock)  : keiSaikai(s2.shokoClock);
    sessionKaku(s2);
    hyouji();
  });

  document.getElementById("owariBtn").addEventListener("click", undouShuryo);

  if (ugoiteiru){
    undouTaimaaId = setInterval(() => { if (gamen === "undou") egakuUndou(); }, 1000);
  }
}

function undouShuryo(){
  const s = sessionYomu(); if (!s) return;
  s.suburiClock = keiIchiji(s.suburiClock);
  s.shokoClock  = keiIchiji(s.shokoClock);
  s.suburiFinalMs = s.suburiClock ? s.suburiClock.accumulatedMs : 0;
  s.shokoFinalMs  = s.shokoClock  ? s.shokoClock.accumulatedMs  : 0;
  sessionKaku(s);
  erabaretaHirouido = null; erabaretaItami = [];
  shuryoSuburiHosei = null; shuryoShokoHosei = null;
  gamen = "shuryo";
  hyouji();
}

/* ---------- 終了記録画面 ----------------------------------------------
   素振り・昇降の分数は手入力で補正できる。操作を忘れたまま
   実際には運動していた、という場合はここで実際の分数に直せる。 */
const HIROU_LABELS = [
  { v:1, t:"余裕あり" }, { v:2, t:"軽い疲労" }, { v:3, t:"通常" },
  { v:4, t:"強い疲労" }, { v:5, t:"かなり強い" }
];
const ITAMI_LABELS = [
  { v:"kata_migi",     t:"右肩" },  { v:"kata_hidari",     t:"左肩" },
  { v:"hiji_migi",     t:"右肘" },  { v:"hiji_hidari",     t:"左肘" },
  { v:"tekubi_migi",   t:"右手首" },{ v:"tekubi_hidari",   t:"左手首" },
  { v:"koshi",         t:"腰" },
  { v:"hiza_migi",     t:"右膝" },  { v:"hiza_hidari",     t:"左膝" },
  { v:"ashikubi_migi", t:"右足首" },{ v:"ashikubi_hidari", t:"左足首" },
  { v:"sonota",        t:"その他" }
];

function egakuShuryo(){
  undouTaimaaTomeru();
  const s = sessionYomu();
  if (!s){ gamen = "home"; hyouji(); return; }

  const settei = setteiYomu();
  const kyo = s.date;

  const suburiMinKijun = Math.round((s.suburiFinalMs || 0) / 60000);
  const shokoMinKijun  = Math.round((s.shokoFinalMs  || 0) / 60000);
  const suburiMinHyouji = shuryoSuburiHosei !== null ? shuryoSuburiHosei : String(suburiMinKijun);
  const shokoMinHyouji  = shuryoShokoHosei  !== null ? shuryoShokoHosei  : String(shokoMinKijun);
  const suburiMinIma = seisu(suburiMinHyouji, suburiMinKijun);
  const shokoMinIma  = seisu(shokoMinHyouji, shokoMinKijun);
  const soukeiMin = suburiMinIma + shokoMinIma;

  const kirokuKyo = kirokuToru(kyo);
  const weight = (kirokuKyo && typeof kirokuKyo.weightKg === "number")
    ? kirokuKyo.weightKg : (saishinTaiju(kyo) || 60);
  const kcal = kcalMitsumori(suburiMinIma * 60000, shokoMinIma * 60000, weight);

  const mokuhyoGoukei = (s.menuSuburiMin || 0) + (s.menuShokoMin || 0);
  const mokuhyoTassei = mokuhyoGoukei > 0 && soukeiMin >= mokuhyoGoukei;
  const jikoBest = s.suburiCount > 0 && s.suburiCount > suburiCountSaikou(kyo);

  app.innerHTML = `
    <div class="shuryo">
      <h2 class="shuryo-midashi">おつかれさまでした</h2>
      <p class="shuryo-sub">今日の記録を確認してください</p>

      ${(mokuhyoTassei || jikoBest) ? `
      <div class="badge-retsu">
        ${mokuhyoTassei ? `<span class="badge">目標達成</span>` : ""}
        ${jikoBest ? `<span class="badge">素振り本数 自己ベスト</span>` : ""}
      </div>` : ""}

      <div class="shuryo-koumoku c-suburi">
        <span>木刀素振り</span>
        <input class="hosei-nyu" id="suburiHoseiNyu" type="number" inputmode="numeric" min="0" step="1" value="${esc(suburiMinHyouji)}" aria-label="素振りの分数（補正可）">
      </div>
      ${s.suburiCount ? `<div class="shuryo-koumoku"><span>本数</span><span class="atai">${s.suburiCount}本</span></div>` : ""}
      <div class="shuryo-koumoku c-shoko">
        <span>一段昇降</span>
        <input class="hosei-nyu" id="shokoHoseiNyu" type="number" inputmode="numeric" min="0" step="1" value="${esc(shokoMinHyouji)}" aria-label="一段昇降の分数（補正可）">
      </div>
      ${s.shokoCount ? `<div class="shuryo-koumoku"><span>回数</span><span class="atai">${s.shokoCount}回</span></div>` : ""}
      <div class="shuryo-koumoku"><span>合計</span><span class="atai">${soukeiMin}分</span></div>
      <p class="hosei-hint">タイマーの分数が実際と違う場合は、上の数字を書き換えてください。</p>
      <p class="shuryo-kcal">消費 約${kcal}kcal（目安）</p>

      <p class="hirou-midashi">今日の疲労度</p>
      <div class="hirou-retsu">
        ${HIROU_LABELS.map(h => `
          <button data-hirou="${h.v}" class="${erabaretaHirouido===h.v ? 'eranda':''}">${h.v}<br>${h.t}</button>
        `).join("")}
      </div>

      <p class="itami-midashi">痛みはありますか</p>
      <div class="itami-retsu">
        ${ITAMI_LABELS.map(i => `
          <button class="itami-chip ${erabaretaItami.includes(i.v) ? 'eranda':''}" data-itami="${i.v}">${i.t}</button>
        `).join("")}
      </div>

      <button class="hozon-owari" id="hozonOwariBtn" ${erabaretaHirouido===null ? "disabled" : ""}>記録して終わる</button>
    </div>
  `;

  const suburiNyu = document.getElementById("suburiHoseiNyu");
  suburiNyu.addEventListener("input", e => { shuryoSuburiHosei = e.target.value; });
  suburiNyu.addEventListener("blur", () => hyouji());
  suburiNyu.addEventListener("keydown", e => { if (e.key === "Enter") suburiNyu.blur(); });

  const shokoNyu = document.getElementById("shokoHoseiNyu");
  shokoNyu.addEventListener("input", e => { shuryoShokoHosei = e.target.value; });
  shokoNyu.addEventListener("blur", () => hyouji());
  shokoNyu.addEventListener("keydown", e => { if (e.key === "Enter") shokoNyu.blur(); });

  app.querySelectorAll("[data-hirou]").forEach(b => {
    b.addEventListener("click", () => { erabaretaHirouido = Number(b.dataset.hirou); hyouji(); });
  });
  app.querySelectorAll("[data-itami]").forEach(b => {
    b.addEventListener("click", () => {
      const v = b.dataset.itami;
      const i = erabaretaItami.indexOf(v);
      if (i >= 0) erabaretaItami.splice(i,1); else erabaretaItami.push(v);
      hyouji();
    });
  });
  if (erabaretaHirouido !== null){
    document.getElementById("hozonOwariBtn").addEventListener("click", hozonOwariSuru);
  }
}

function hozonOwariSuru(){
  const s = sessionYomu(); if (!s) return;
  const settei = setteiYomu();

  const suburiMinKijun = Math.round((s.suburiFinalMs || 0) / 60000);
  const shokoMinKijun  = Math.round((s.shokoFinalMs  || 0) / 60000);
  const suburiMinFinal = seisu(shuryoSuburiHosei !== null ? shuryoSuburiHosei : String(suburiMinKijun), suburiMinKijun);
  const shokoMinFinal  = seisu(shuryoShokoHosei  !== null ? shuryoShokoHosei  : String(shokoMinKijun),  shokoMinKijun);

  const wake = ashiWake(shokoMinFinal * 60000, settei.kirikaeFun, s.legMode);

  kirokuKaku(s.date, {
    suburiMin: suburiMinFinal,
    suburiCount: s.suburiCount || null,
    shokoMigiMin: Math.round(wake.migiMs / 60000),
    shokoHidariMin: Math.round(wake.hidariMs / 60000),
    shokoCount: s.shokoCount || null,
    fatigue: erabaretaHirouido,
    pain: erabaretaItami.slice(),
    legModeUsed: s.legMode
  });

  sessionKaku(null);
  gamen = "home";
  hyouji();
}

teemaTekiyou(setteiYomu().colorTeema);
hyouji();
</script>
</body>
</html>
